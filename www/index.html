 facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"alternating-front-raise","n":"Alternating Front Raise","eq":"db","p":["frontdelt"],"s":["sidedelt"],"pt":"push","m":"iso","g":[],"how":["In a standing position, hold a pair of dumbbells at your side.","Keeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.","Return the weights to your side.","On the next repetition, raise the weights laterally, raising them out to your side to about shoulder height.","Return the weights to the starting position and continue alternating to the front and side."],"lvl":"beginner"},{"id":"one-arm-cable-front-raise","n":"One-Arm Cable Front Raise","eq":"cable","p":["frontdelt"],"s":[],"pt":"push","m":"iso","g":[],"how":["Select the weight on a low pulley machine and grasp the single hand cable attachment that is attached to the low pulley with your left hand.","Face away from the pulley and put your arm straight down with the hand cable attachment in front of your thighs at arms' length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the left arm to the front with a slight bend on the elbow and the palms of the hand always faces down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top.","Now as you inhale lower the arm back down slowly to the starting position.","Once all of the recommended amount of repetitions have been performed for this arm, switch arms and perform the exercise with the right one."],"lvl":"beginner"},{"id":"plate-front-raise","n":"Plate Front Raise","eq":"other","p":["frontdelt"],"s":[],"pt":"push","m":"iso","g":[],"how":["While standing straight, hold a barbell plate in both hands at the 3 and 9 o'clock positions. Your palms should be facing each other and your arms should be extended and locked with a slight bend at the elbows and the plate should be down near your waist in front of you as far as you can go. Tip: The arms will remain in this position throughout the exercise. This will be your starting position.","Slowly raise the plate as you exhale until it is a little above shoulder level. Hold the contraction for a second. Tip: make sure that you do not swing the weight or bend at the elbows. Your torso should remain stationary throughout the movement as well.","As you inhale, slowly lower the plate back down to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"ez-bar-front-raise","n":"EZ-Bar Front Raise","eq":"other","p":["frontdelt"],"s":[],"pt":"push","m":"iso","g":[]},{"id":"cross-body-cable-y-raise","n":"Cross-Body Cable Y-Raise","eq":"cable","p":["sidedelt"],"s":["reardelt"],"pt":"push","m":"iso","g":[]},{"id":"dumbbell-upright-row","n":"Dumbbell Upright Row","eq":"db","p":["sidedelt"],"s":["traps","biceps"],"pt":"pull","m":"comp","g":[],"how":["Grasp a dumbbell in each hand with a pronated (palms forward) grip that is slightly less than shoulder width. The dumbbells should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the dumbbells as you exhale. The dumbbells should be close to the body as you move it up and the elbows should drive the motion. Continue to lift them until they nearly touch your chin. Tip: Your elbows should drive the motion. As you lift the dumbbells, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbells back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"smith-machine-upright-row","n":"Smith Machine Upright Row","eq":"smith","p":["sidedelt"],"s":["traps","biceps"],"pt":"pull","m":"comp","g":[],"how":["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.","Lift the barbell up and fully extend your arms with your back straight. There should be a slight bend at the elbows. This is the starting position.","Use your side shoulders to lift the bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"single-arm-upright-row","n":"Single-Arm Upright Row","eq":"db","p":["sidedelt"],"s":["traps"],"pt":"pull","m":"comp","g":[],"how":["Grab a dumbbell and stand up straight with your arm extended in front of you with a slight bend at the elbows and your back straight. This will be your starting position. Tip: The dumbbell should be resting on top of your thigh with the palm of your hands facing your thighs.","Keep the other hand can be kept fully extended to the side, by the waist or grabbing a fixed surface. This will be your starting position.","Use your side shoulders to lift the dumbbell as you exhale. The dumbbell should be close to the body as you move it up. Continue to lift it until the dumbbell is nearly in line with your chin. Tip: Your elbows should drive the motion. As you lift the dumbbell, your elbow should always be higher than your forearm. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbell back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions and switch arms."],"lvl":"intermediate"},{"id":"barbell-upright-row","n":"Barbell Upright Row","eq":"bb","p":["sidedelt"],"s":["traps","biceps"],"pt":"pull","m":"comp","g":[],"how":["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.","Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"bent-over-lateral-raise","n":"Bent-Over Lateral Raise","eq":"db","p":["reardelt"],"s":["midback"],"pt":"pull","m":"iso","g":[],"how":["Place a couple of dumbbells looking forward in front of a flat bench.","Sit on the end of the bench with your legs together and the dumbbells behind your calves.","Bend at the waist while keeping the back straight in order to pick up the dumbbells. The palms of your hands should be facing each other as you pick them. This will be your starting position.","Keeping your torso forward and stationary, and the arms slightly bent at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. (Note: avoid swinging the torso or bringing the arms back as opposed to the side.)","After a one second contraction at the top, slowly lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"high-cable-rear-delt-fly","n":"High Cable Rear Delt Fly","eq":"cable","p":["reardelt"],"s":["midback"],"pt":"pull","m":"iso","g":[],"how":["Adjust the pulleys to the appropriate height and adjust the weight. The pulleys should be above your head.","Grab the left pulley with your right hand and the right pulley with your left hand, crossing them in front of you. This will be your starting position.","Initiate the movement by moving your arms back and outward, keeping your arms straight as you execute the movement.","Pause at the end of the motion before returning the handles to the start position."],"lvl":"beginner"},{"id":"reverse-cable-fly","n":"Reverse Cable Fly","eq":"cable","p":["reardelt"],"s":["midback"],"pt":"pull","m":"iso","g":[],"how":["Adjust the pulleys to the appropriate height and adjust the weight. The pulleys should be above your head.","Grab the left pulley with your right hand and the right pulley with your left hand, crossing them in front of you. This will be your starting position.","Initiate the movement by moving your arms back and outward, keeping your arms straight as you execute the movement.","Pause at the end of the motion before returning the handles to the start position."],"lvl":"beginner"},{"id":"reverse-pec-deck","n":"Reverse Pec Deck","eq":"mach","p":["reardelt"],"s":["midback"],"pt":"pull","m":"iso","g":[],"how":["To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).","Extend the arms in front of you so that they are perpendicular to the angle of the bench. The legs should be stationary while applying pressure with the ball of your toes. This is the starting position.","Maintaining the slight bend of the elbows, move the weights out and away from each other (to the side) in an arc motion while exhaling. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.","The arms should be elevated until they are parallel to the floor.","Feel the contraction and slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"seated-rear-delt-fly","n":"Seated Rear Delt Fly","eq":"db","p":["reardelt"],"s":["midback"],"pt":"pull","m":"iso","g":[],"how":["Place a couple of dumbbells looking forward in front of a flat bench.","Sit on the end of the bench with your legs together and the dumbbells behind your calves.","Bend at the waist while keeping the back straight in order to pick up the dumbbells. The palms of your hands should be facing each other as you pick them. This will be your starting position.","Keeping your torso forward and stationary, and the arms slightly bent at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. (Note: avoid swinging the torso or bringing the arms back as opposed to the side.)","After a one second contraction at the top, slowly lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"face-pull","n":"Face Pull","eq":"cable","p":["reardelt"],"s":["midback","traps"],"pt":"pull","m":"iso","g":[],"how":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"lvl":"intermediate"},{"id":"doorway-face-pull","n":"Doorway Face Pull","eq":"bw","p":["reardelt"],"s":["midback"],"pt":"pull","m":"iso","g":[],"how":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"lvl":"intermediate"},{"id":"banded-external-rotation","n":"Banded External Rotation","eq":"band","p":["reardelt"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Lie sideways on a flat bench with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.","Bend the elbows of the arm holding the dumbbell so that it creates a 90-degree angle between the upper arm and the forearm. Tip: Keep the arm parallel to your torso.","Now bend the elbow while keeping the upper arm stationary. In this manner, the forearm will be parallel to the floor and perpendicular to your torso (Tip: So the forearm will be directly in front of you). The upper arm will be stationary by your torso and should be parallel to the floor (aligned with your torso at all times). This will be your starting position.","As you breathe out, externally rotate your forearm so that the dumbbell is lifted up in a semicircle motion as you maintain the 90 degree angle bend between the upper arms and the forearm. You will continue this external rotation until the forearm is perpendicular to the floor and the torso pointing towards the ceiling. At this point you will hold the contraction for a second.","As you breathe in, slowly go back to the starting position.","Repeat for the recommended amount of repetitions and then switch to the other arm."],"lvl":"beginner"},{"id":"band-lateral-raise","n":"Band Lateral Raise","eq":"band","p":["sidedelt"],"s":[],"pt":"push","m":"iso","g":[],"how":["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on the sides of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the handles to the sides as you exhale. Continue to lift the handles until they are slightly above parallel. Tip: As you lift the handles, slightly tilt the hand as if you were pouring water and keep your arms extended. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-shrug","n":"Dumbbell Shrug","eq":"db","p":["traps"],"s":["forearms"],"pt":"pull","m":"iso","g":[],"how":["Stand erect with a dumbbell on each hand (palms facing your torso), arms extended on the sides.","Lift the dumbbells by elevating the shoulders as high as possible while you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the dumbbells. Only the shoulders should be moving up and down.","Lower the dumbbells back to the original position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"barbell-shrug","n":"Barbell Shrug","eq":"bb","p":["traps"],"s":["forearms"],"pt":"pull","m":"iso","g":[],"how":["Stand up straight with your feet at shoulder width as you hold a barbell with both hands in front of you using a pronated grip (palms facing the thighs). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"one-arm-smith-machine-shrug","n":"One-Arm Smith Machine Shrug","eq":"smith","p":["traps"],"s":[],"pt":"pull","m":"iso","g":[]},{"id":"barbell-curl","n":"Barbell Curl","eq":"bb","p":["biceps"],"s":["forearms"],"pt":"pull","m":"iso","g":["Shoulder-width","Wide","Close"],"how":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"barbell-curl-21s","n":"Barbell Curl 21s","eq":"bb","p":["biceps"],"s":["forearms"],"pt":"pull","m":"iso","g":[],"how":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"ez-bar-preacher-curl","n":"EZ-Bar Preacher Curl","eq":"other","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.","With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.","As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"preacher-curl","n":"Preacher Curl","eq":"db","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.","With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.","As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-incline-curl","n":"Dumbbell Incline Curl","eq":"db","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Sit back on an incline bench with a dumbbell in each hand held at arms length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"seated-dumbbell-curl","n":"Seated Dumbbell Curl","eq":"db","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Sit on a flat bench with a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","Rotate the palms of the hands so that they are facing your torso. This will be your starting position.","While holding the upper arm stationary, curl the weights and start twisting the wrists once the dumbbells pass your thighs so that the palms of your hands face forward at the end of the movement. Make sure that you contract the biceps as you breathe out and make sure that only the forearms move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in and as you rotate the wrists back to a neutral grip.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-hammer-curl","n":"Dumbbell Hammer Curl","eq":"db","p":["biceps"],"s":["forearms"],"pt":"pull","m":"iso","g":["Neutral"],"how":["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.","After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-concentration-curl","n":"Dumbbell Concentration Curl","eq":"db","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Sit down on a flat bench with one dumbbell in front of you between your legs. Your legs should be spread with your knees bent and feet on the floor.","Use your right arm to pick the dumbbell up. Place the back of your right upper arm on the top of your inner right thigh. Rotate the palm of your hand until it is facing forward away from your thigh. Tip: Your arm should be extended and the dumbbell should be above the floor. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: At the top of the movement make sure that the little finger of your arm is higher than your thumb. This guarantees a good contraction. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to starting position as your breathe in. Caution: Avoid swinging motions at any time.","Repeat for the recommended amount of repetitions. Then repeat the movement with the left arm."],"lvl":"beginner"},{"id":"high-cable-curl","n":"High Cable Curl","eq":"cable","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. This will be your starting position.","Curl the handles towards you until they are next to your ears. Make sure that as you do so you flex your biceps and exhale. The upper arms should remain stationary and only the forearms should move. Hold for a second in the contracted position as you squeeze the biceps.","Slowly bring back the arms to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"one-arm-high-cable-curl","n":"One-Arm High Cable Curl","eq":"cable","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Start out by grabbing single handle next to the low pulley machine. Make sure you are far enough from the machine so that your arm is supporting the weight.","Make sure that your upper arm is stationary, perpendicular to the floor with elbows in and palms facing forward. Your non lifting arm should be grabbing your waist. This will allow you to keep your balance.","Slowly begin to curl the single handle upwards while keeping the upper arm stationary until your forearm touches your bicep while exhaling. Tip: Only the forearm should move.","Hold the contraction position as you squeeze the bicep and then lower the single handle back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions.","Switch arms while performing this exercise."],"lvl":"intermediate"},{"id":"incline-cable-curl","n":"Incline Cable Curl","eq":"cable","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[]},{"id":"behind-back-cable-curl","n":"Behind-Back Cable Curl","eq":"cable","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[]},{"id":"standing-cable-curl","n":"Standing Cable Curl","eq":"cable","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the curl bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"reverse-ez-bar-curl","n":"Reverse EZ-Bar Curl","eq":"other","p":["forearms"],"s":["biceps"],"pt":"pull","m":"iso","g":["Overhand"]},{"id":"drag-curl","n":"Drag Curl","eq":"bb","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Grab a barbell with a supinated grip (palms facing forward) and get your elbows close to your torso and back. This will be your starting position.","As you exhale, curl the bar up while keeping the elbows to the back as you \"Drag\" the bar up by keeping it in contact with your torso. Tip: As you can see, you will not be keeping the elbows pinned to your sides, but instead you will be bringing them back. Also, do not lift your shoulders.","Slowly go back to the starting position as you keep the bar in contact with the torso at all times.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"band-curl","n":"Band Curl","eq":"band","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[]},{"id":"alternating-dumbbell-curl","n":"Alternating Dumbbell Curl","eq":"db","p":["biceps"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Stand up straight with a dumbbell in each hand at arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"rope-cable-curl","n":"Rope Cable Curl","eq":"cable","p":["biceps"],"s":["forearms"],"pt":"pull","m":"iso","g":[],"how":["Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.","Grasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.","Put your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.","Using your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary.","After a 1 second contraction where you squeeze your biceps, slowly start to bring the weight back to the original position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"wrist-curl","n":"Wrist Curl","eq":"db","p":["forearms"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Start out by placing a flat bench in front of a low pulley cable that has a straight bar attachment.","Use your arms to grab the cable bar with a narrow to shoulder width supinated grip (palms up) and bring them up so that your forearms are resting against the top of your thighs. Your wrists should be hanging just beyond your knees.","Start out by curling your wrist upwards and exhaling. Keep the contraction for a second.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"reverse-grip-cable-curl","n":"Reverse-Grip Cable Curl","eq":"cable","p":["forearms"],"s":["biceps"],"pt":"pull","m":"iso","g":["Overhand"],"how":["Stand up with your torso upright while holding a bar attachment that is attached to a low pulley using a pronated (palms down) and shoulder width grip. Make sure also that you keep the elbows close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"triceps-pressdown","n":"Triceps Pressdown","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":["Straight bar","Rope","V-bar"],"how":["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"rope-pushdown","n":"Rope Pushdown","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"pushdown-21s","n":"Pushdown 21s","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"lying-triceps-extension","n":"Lying Triceps Extension","eq":"bb","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Lie on a flat bench and grasp the straight bar attachment of a low pulley with a narrow overhand grip. Tip: The easiest way to do this is to have someone hand you the bar as you lay down.","With your arms extended, position the bar over your torso. Your arms and your torso should create a 90-degree angle. This will be your starting position.","Lower the bar by bending at the elbow while keeping the upper arms stationary and elbows in. Go down until the bar lightly touches your forehead. Breathe in as you perform this portion of the movement.","Flex the triceps as you lift the bar back to its starting position. Exhale as you perform this portion of the movement.","Hold for a second at the contracted position and repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"ez-bar-skullcrusher","n":"EZ-Bar Skullcrusher","eq":"other","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Using a close grip, lift the EZ bar and hold it with your elbows in as you lie on the bench. Your arms should be perpendicular to the floor. This will be your starting position.","Keeping the upper arms stationary, lower the bar by allowing the elbows to flex. Inhale as you perform this portion of the movement. Pause once the bar is directly above the forehead.","Lift the bar back to the starting position by extending the elbow and exhaling.","Repeat."],"lvl":"beginner"},{"id":"floor-reset-skullcrusher","n":"Floor-Reset Skullcrusher","eq":"other","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[]},{"id":"three-angle-skullcrusher","n":"Three-Angle Skullcrusher","eq":"other","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Using a close grip, lift the EZ bar and hold it with your elbows in as you lie on the bench. Your arms should be perpendicular to the floor. This will be your starting position.","Keeping the upper arms stationary, lower the bar by allowing the elbows to flex. Inhale as you perform this portion of the movement. Pause once the bar is directly above the forehead.","Lift the bar back to the starting position by extending the elbow and exhaling.","Repeat."],"lvl":"beginner"},{"id":"inverted-bodyweight-skullcrusher","n":"Inverted Bodyweight Skullcrusher","eq":"bw","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Position a bar in a rack at chest height.","Standing, take a shoulder width grip on the bar and step a yard or two back, feet together and arms extended so that you are leaning on the bar. This will be your starting position.","Begin by flexing the elbow, lowering yourself towards the bar.","Pause, and then reverse the motion by extending the elbows.","Progress from bodyweight by adding chains over your shoulders."],"lvl":"beginner"},{"id":"cable-overhead-triceps-extension","n":"Cable Overhead Triceps Extension","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Attach a rope to the bottom pulley of the pulley machine.","Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.","Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"cable-rope-overhead-extension","n":"Cable Rope Overhead Extension","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Attach a rope to the bottom pulley of the pulley machine.","Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.","Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"one-arm-overhead-cable-triceps-extension","n":"One-Arm Overhead Cable Triceps Extension","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["With your right hand, grasp a single handle attached to the high-cable pulley using a supinated (underhand; palms facing up) grip. You should be standing directly in front of the weight stack.","Now pull the handle down so that your upper arm and elbow are locked in to the side of your body. Your upper arm and forearm should form an acute angle (less than 90-degrees). You can keep the other arm by the waist and you can have one leg in front of you and the other one back for better balance. This will be your starting position.","As you contract the triceps, move the single handle attachment down to your side until your arm is straight. Breathe out as you perform this movement. Tip: Only the forearms should move. Your upper arms should remain stationary at all times.","Squeeze the triceps and hold for a second in this contracted position.","Slowly return the handle to the starting position.","Repeat for the recommended amount of repetitions and then perform the same movement with the other arm."],"lvl":"beginner"},{"id":"single-arm-cable-extension","n":"Single-Arm Cable Extension","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["With your right hand, grasp a single handle attached to the high-cable pulley using a supinated (underhand; palms facing up) grip. You should be standing directly in front of the weight stack.","Now pull the handle down so that your upper arm and elbow are locked in to the side of your body. Your upper arm and forearm should form an acute angle (less than 90-degrees). You can keep the other arm by the waist and you can have one leg in front of you and the other one back for better balance. This will be your starting position.","As you contract the triceps, move the single handle attachment down to your side until your arm is straight. Breathe out as you perform this movement. Tip: Only the forearms should move. Your upper arms should remain stationary at all times.","Squeeze the triceps and hold for a second in this contracted position.","Slowly return the handle to the starting position.","Repeat for the recommended amount of repetitions and then perform the same movement with the other arm."],"lvl":"beginner"},{"id":"dumbbell-overhead-triceps-extension","n":"Dumbbell Overhead Triceps Extension","eq":"db","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[]},{"id":"single-arm-dumbbell-triceps-extension","n":"Single-Arm Dumbbell Triceps Extension","eq":"db","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height and then extend the arm over your head so that the whole arm is perpendicular to the floor and next to your head. The dumbbell should be on top of you. The other hand can be kept fully extended to the side, by the waist, supporting the upper arm that has the dumbbell or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward and the pinkie is facing the ceiling. This will be your starting position.","Slowly lower the dumbbell behind your head as you hold the upper arm stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out. Tip: It is imperative that only the forearm moves. The upper arm should remain at all times stationary next to your head.","Repeat for the recommended amount of repetitions and switch arms."],"lvl":"intermediate"},{"id":"cable-lying-triceps-extension","n":"Cable Lying Triceps Extension","eq":"cable","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Lie on a flat bench and grasp the straight bar attachment of a low pulley with a narrow overhand grip. Tip: The easiest way to do this is to have someone hand you the bar as you lay down.","With your arms extended, position the bar over your torso. Your arms and your torso should create a 90-degree angle. This will be your starting position.","Lower the bar by bending at the elbow while keeping the upper arms stationary and elbows in. Go down until the bar lightly touches your forehead. Breathe in as you perform this portion of the movement.","Flex the triceps as you lift the bar back to its starting position. Exhale as you perform this portion of the movement.","Hold for a second at the contracted position and repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-kickback","n":"Dumbbell Kickback","eq":"db","p":["triceps"],"s":[],"pt":"push","m":"iso","g":[],"how":["Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.","Now, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.","After a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position.","Repeat the movement for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"bench-dip","n":"Bench Dip","eq":"bw","p":["triceps"],"s":["chest","frontdelt"],"pt":"push","m":"comp","g":[],"how":["For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.","Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.","Using your triceps to bring your torso up again, lift yourself back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"feet-elevated-bench-dip","n":"Feet-Elevated Bench Dip","eq":"bw","p":["triceps"],"s":["chest","frontdelt"],"pt":"push","m":"comp","g":[],"how":["For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.","Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.","Using your triceps to bring your torso up again, lift yourself back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"squat","n":"Squat","eq":"bb","p":["quads"],"s":["glutes","hams","lowback"],"pt":"squat","m":"comp","g":["High bar","Low bar"],"how":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"front-squat","n":"Front Squat","eq":"bb","p":["quads"],"s":["glutes","abs"],"pt":"squat","m":"comp","g":[],"how":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, bring your arms up under the bar while keeping the elbows high and the upper arm slightly above parallel to the floor. Rest the bar on top of the deltoids and cross your arms while grasping the bar for total control.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor mainly with the middle of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"expert"},{"id":"box-squat","n":"Box Squat","eq":"bb","p":["quads"],"s":["glutes","hams"],"pt":"squat","m":"comp","g":[],"how":["The box squat allows you to squat to desired depth and develop explosive strength in the squat movement. Begin in a power rack with a box at the appropriate height behind you. Typically, you would aim for a box height that brings you to a parallel squat, but you can train higher or lower if desired.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.","Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe."],"lvl":"intermediate"},{"id":"goblet-squat","n":"Goblet Squat","eq":"db","p":["quads"],"s":["glutes"],"pt":"squat","m":"comp","g":[],"how":["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.","Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.","At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."],"lvl":"beginner"},{"id":"bulgarian-split-squat","n":"Bulgarian Split Squat","eq":"db","p":["quads"],"s":["glutes","hams"],"pt":"lunge","m":"comp","g":[],"how":["Being in a standing position. Jump into a split leg position, with one leg forward and one leg back, flexing the knees and lowering your hips slightly as you do so.","As you descend, immediately reverse direction, standing back up and jumping, reversing the position of your legs. Repeat 5-10 times on each leg."],"lvl":"intermediate"},{"id":"lunge","n":"Lunge","eq":"db","p":["quads"],"s":["glutes","hams"],"pt":"lunge","m":"comp","g":[],"how":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."],"lvl":"intermediate"},{"id":"reverse-lunge","n":"Reverse Lunge","eq":"db","p":["quads"],"s":["glutes","hams"],"pt":"lunge","m":"comp","g":[],"how":["Stand with your feet shoulder width apart. This will be your starting position.","Perform a rear lunge by stepping back with one foot and flexing the hips and front knee. As you do so, rotate your torso across the front leg.","After a brief pause, return to the starting position and repeat on the other side, continuing in an alternating fashion."],"lvl":"intermediate"},{"id":"walking-lunge","n":"Walking Lunge","eq":"db","p":["quads"],"s":["glutes","hams"],"pt":"lunge","m":"comp","g":[],"how":["Begin standing with your feet shoulder width apart and a barbell across your upper back.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."],"lvl":"beginner"},{"id":"squat-to-static-reverse-creeping-lunge","n":"Squat to Static Reverse Creeping Lunge","eq":"bw","p":["quads"],"s":["glutes","hams"],"pt":"lunge","m":"comp","g":[]},{"id":"leg-press","n":"Leg Press","eq":"mach","p":["quads"],"s":["glutes","hams"],"pt":"squat","m":"comp","g":[],"how":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"lvl":"beginner"},{"id":"one-leg-leg-press","n":"One-Leg Leg Press","eq":"mach","p":["quads"],"s":["glutes"],"pt":"squat","m":"comp","g":[],"how":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"lvl":"beginner"},{"id":"leg-extension","n":"Leg Extension","eq":"mach","p":["quads"],"s":[],"pt":"squat","m":"iso","g":[],"how":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."],"lvl":"beginner"},{"id":"romanian-deadlift","n":"Romanian Deadlift","eq":"bb","p":["hams"],"s":["glutes","lowback"],"pt":"hinge","m":"comp","g":[],"how":["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.","Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.","Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.","Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"lying-leg-curl","n":"Lying Leg Curl","eq":"mach","p":["hams"],"s":[],"pt":"hinge","m":"iso","g":[],"how":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"seated-leg-curl","n":"Seated Leg Curl","eq":"mach","p":["hams"],"s":[],"pt":"hinge","m":"iso","g":[],"how":["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.","Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.","As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"hip-thrust","n":"Hip Thrust","eq":"bb","p":["glutes"],"s":["hams"],"pt":"hinge","m":"comp","g":[],"how":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."],"lvl":"intermediate"},{"id":"weighted-hip-thrust","n":"Weighted Hip Thrust","eq":"db","p":["glutes"],"s":["hams"],"pt":"hinge","m":"comp","g":[],"how":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."],"lvl":"intermediate"},{"id":"smith-machine-hip-thrust","n":"Smith Machine Hip Thrust","eq":"smith","p":["glutes"],"s":["hams"],"pt":"hinge","m":"comp","g":[],"how":["Position a bench in the rack and load the bar to an appropriate weight. Lie down on the bench, placing the bottom of your feet against the bar. Unlock the bar and extend your legs. You may need to use your hands to assist you. For added stability grasp the sides of the Smith Machine. This will be your starting position.","Initiate the movement by rotating your pelvis, flexing your spine to raise your hips off of the bench. Maintain a slight bend in the knees throughout the motion.","After a brief pause, return the hips to the bench.","Repeat for the desired number of repetitions."],"lvl":"beginner"},{"id":"bridge-and-reach-over","n":"Bridge and Reach Over","eq":"bw","p":["glutes"],"s":["obliques","hams"],"pt":"hinge","m":"comp","g":[]},{"id":"dumbbell-step-up","n":"Dumbbell Step-Up","eq":"db","p":["quads"],"s":["glutes"],"pt":"lunge","m":"comp","g":[],"how":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."],"lvl":"intermediate"},{"id":"side-lunge","n":"Side Lunge","eq":"bw","p":["quads"],"s":["glutes"],"pt":"lunge","m":"comp","g":[]},{"id":"standing-calf-raise","n":"Standing Calf Raise","eq":"mach","p":["calves"],"s":[],"pt":"squat","m":"iso","g":[],"how":["Adjust the padded lever of the calf raise machine to fit your height.","Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"seated-calf-raise","n":"Seated Calf Raise","eq":"mach","p":["calves"],"s":[],"pt":"squat","m":"iso","g":[],"how":["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.","Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.","Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.","Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.","Raise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"leg-press-calf-raise","n":"Leg Press Calf Raise","eq":"mach","p":["calves"],"s":[],"pt":"squat","m":"iso","g":[],"how":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance.","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you without locking your knees. (Note: In some leg press units you can leave the safety bars on for increased safety. If your leg press unit allows for this, then this is the preferred method of performing the exercise.) Your torso and the legs should make perfect 90-degree angle. Now carefully place your toes and balls of your feet on the lower portion of the platform with the heels extending off. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Press on the platform by raising your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"crunch","n":"Crunch","eq":"bw","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Lie on the floor with your back flat and knees bent with around a 60-degree angle between the hamstrings and the calves.","Keep your feet flat on the floor and stretch your arms overhead with your palms crossed. This will be your starting position.","Curl your upper body forward and bring your shoulder blades just off the floor. At all times, keep your arms aligned with your head, neck and shoulder. Don't move them forward from that position. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly lower down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"weighted-crunch","n":"Weighted Crunch","eq":"db","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Kneel below a high pulley that contains a rope attachment.","Grasp cable rope attachment and lower the rope until your hands are placed next to your face.","Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.","With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"oblique-crunch","n":"Oblique Crunch","eq":"bw","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[],"how":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Raise your upper body off the bench until your torso is about 35-45 degrees if measured from the floor.","Put one hand beside your head and the other on your thigh. This will be your starting position.","Raise your upper body slowly from the starting position while turning your torso to the left. Continue crunching up as you exhale until your right elbow touches your left knee. Hold this contracted position for a second. Tip: Focus on keeping your abs tight and keeping the movement slow and controlled.","Lower your body back down slowly to the starting position as you inhale.","After completing one set on the right for the recommended amount of repetitions, switch to your left side. Tip: Focus on really twisting your torso and feeling the contraction when you are in the up position."],"lvl":"beginner"},{"id":"cable-crunch","n":"Cable Crunch","eq":"cable","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Kneel below a high pulley that contains a rope attachment.","Grasp cable rope attachment and lower the rope until your hands are placed next to your face.","Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.","With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"cable-oblique-crunch","n":"Cable Oblique Crunch","eq":"cable","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[]},{"id":"machine-crunch","n":"Machine Crunch","eq":"mach","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.","At the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.","After a second pause, slowly return to the starting position as you breathe in.","Repeat the movement for the prescribed amount of repetitions."],"lvl":"intermediate"},{"id":"rope-crunch","n":"Rope Crunch","eq":"cable","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Kneel 1-2 feet in front of a cable system with a rope attached.","After selecting an appropriate weight, grasp the rope with both hands reaching overhead. Your torso should be upright in the starting position.","To begin, flex at the spine, attempting to bring your rib cage to your legs as you pull the cable down.","Pause at the bottom of the motion, and then slowly return to the starting position.","These can be done with twists or to the side to hit the obliques."],"lvl":"beginner"},{"id":"cable-reverse-crunch","n":"Cable Reverse Crunch","eq":"cable","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Connect an ankle strap attachment to a low pulley cable and position a mat on the floor in front of it.","Sit down with your feet toward the pulley and attach the cable to your ankles.","Lie down, elevate your legs and bend your knees at a 90-degree angle. Your legs and the cable should be aligned. If not, adjust the pulley up or down until they are.","With your hands behind your head, bring your knees inward to your torso and elevate your hips off the floor.","Pause for a moment and in a slow and controlled manner drop your hips and bring your legs back to the starting 90-degree angle. You should still have tension on your abs in the resting position.","Repeat the same movement to failure."],"lvl":"beginner"},{"id":"decline-reverse-crunch","n":"Decline Reverse Crunch","eq":"bw","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Lie on your back on a decline bench and hold on to the top of the bench with both hands. Don't let your body slip down from this position.","Hold your legs parallel to the floor using your abs to hold them there while keeping your knees and feet together. Tip: Your legs should be fully extended with a slight bend on the knee. This will be your starting position.","While exhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the bench. At the end of this movement your knees will be touching your chest.","Hold the contraction for a second and move your legs back to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"weighted-sit-up-with-bands","n":"Weighted Sit-Up with Bands","eq":"band","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Start out by strapping the bands around the base of the decline bench. Place the handles towards the inside of the decline bench so that when lying down, you can reach for both of them.","Position your legs through the decline machine until they are secured. Now reach for the exercise bands with both hands. Use a pronated (palms forward) grip to grasp the handles. Position them near your collar bone and rotate your wrist to a neutral grip (palms facing the torso). Note: Your arms should remain stationary throughout the exercise. This is the starting position.","Move your torso upward until your upper body is perpendicular to the floor while exhaling. Hold the contraction for a second and lower your upper body back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"hanging-leg-raise","n":"Hanging Leg Raise","eq":"bw","p":["abs"],"s":["forearms"],"pt":"core","m":"iso","g":[],"how":["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.","Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.","Go back slowly to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"expert"},{"id":"knee-raise-on-parallel-bars","n":"Knee Raise on Parallel Bars","eq":"bw","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Position your body on the vertical leg raise bench so that your forearms are resting on the pads next to the torso and holding on to the handles. Your arms will be bent at a 90 degree angle.","The torso should be straight with the lower back pressed against the pad of the machine and the legs extended pointing towards the floor. This will be your starting position.","Now as you breathe out, lift your legs up as you keep them extended. Continue this movement until your legs are roughly parallel to the floor and then hold the contraction for a second. Tip: Do not use any momentum or swinging as you perform this exercise.","Slowly go back to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"gorilla-chin-up-oblique-crunch","n":"Gorilla Chin-Up Oblique Crunch","eq":"bw","p":["obliques"],"s":["abs","lats"],"pt":"core","m":"iso","g":[],"how":["Hang from a chin-up bar using an underhand grip (palms facing you) that is slightly wider than shoulder width.","Now bend your knees at a 90 degree angle so that the calves are parallel to the floor while the thighs remain perpendicular to it. This will be your starting position.","As you exhale, pull yourself up while crunching your knees up at the same time until your knees are at chest level. You will stop going up as soon as your nose is at the same level as the bar. Tip: When you get to this point you should also be finishing the crunch at the same time.","Slowly start to inhale as you return to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"suspended-oblique-crunch","n":"Suspended Oblique Crunch","eq":"other","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[]},{"id":"dumbbell-side-bend","n":"Dumbbell Side Bend","eq":"db","p":["obliques"],"s":[],"pt":"core","m":"iso","g":[],"how":["Stand up straight while holding a dumbbell on the left hand (palms facing the torso) as you have the right hand holding your waist. Your feet should be placed at shoulder width. This will be your starting position.","While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.","Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position."
