,"Repeat for the recommended amount of repetitions and then change hands."],"lvl":"beginner"},{"id":"cable-woodchopper","n":"Cable Woodchopper","eq":"cable","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[],"how":["Connect a standard handle to a tower, and move the cable to the highest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle down and across your body to your front knee while rotating your torso.","Keep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.","Maintain your stance and straight arms. Return to the neutral position in a slow and controlled manner."],"lvl":"beginner"},{"id":"band-roundhouse-elbow","n":"Band Roundhouse Elbow","eq":"band","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[]},{"id":"seated-barbell-twist","n":"Seated Barbell Twist","eq":"bb","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[],"how":["Start out by sitting at the end of a flat bench with a barbell placed on top of your thighs. Your feet should be shoulder width apart from each other.","Grip the bar with your palms facing down and make sure your hands are wider than shoulder width apart from each other. Begin to lift the barbell up over your head until your arms are fully extended.","Now lower the barbell behind your head until it is resting along the base of your neck. This is the starting position.","While keeping your feet and head stationary, move your waist from side to side so that your oblique muscles feel the contraction. Only move from side to side as far as your waist will allow you to go. Stretching or moving too far can cause an injury to occur. Tip: Use a slow and controlled motion.","Remember to breathe out while twisting your body to the side and in when moving back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"plank","n":"Plank","eq":"bw","p":["abs"],"s":["obliques","lowback"],"pt":"core","m":"iso","g":[],"how":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."],"lvl":"beginner"},{"id":"side-plank","n":"Side Plank","eq":"bw","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[],"how":[],"lvl":"beginner"},{"id":"side-plank-raise-on-a-ball","n":"Side Plank Raise on a Ball","eq":"other","p":["obliques"],"s":["abs"],"pt":"core","m":"iso","g":[]},{"id":"ab-roll-out","n":"Ab Roll-Out","eq":"other","p":["abs"],"s":["lats"],"pt":"core","m":"iso","g":[],"how":["Hold the Ab Roller with both hands and kneel on the floor.","Now place the ab roller on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.","Slowly roll the ab roller straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.","After a pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times."],"lvl":"intermediate"},{"id":"heels-to-heaven","n":"Heels to Heaven","eq":"bw","p":["abs"],"s":[],"pt":"core","m":"iso","g":[],"how":["Lie on the floor with the knees bent and the feet on the floor around 18-24 inches apart. Your arms should be extended by your side. This will be your starting position.","Crunch over your torso forward and up about 3-4 inches to the right side and touch your right heel as you hold the contraction for a second. Exhale while performing this movement.","Now go back slowly to the starting position as you inhale.","Now crunch over your torso forward and up around 3-4 inches to the left side and touch your left heel as you hold the contraction for a second. Exhale while performing this movement and then go back to the starting position as you inhale. Now that both heels have been touched, that is considered 1 repetition.","Continue alternating sides in this manner until all prescribed repetitions are done."],"lvl":"beginner"},{"id":"mountain-climber","n":"Mountain Climber","eq":"bw","p":["abs"],"s":["quads","frontdelt"],"pt":"core","m":"comp","g":[],"how":["Begin in a pushup position, with your weight supported by your hands and toes. Flexing the knee and hip, bring one leg until the knee is approximately under the hip. This will be your starting position.","Explosively reverse the positions of your legs, extending the bent leg until the leg is straight and supported by the toe, and bringing the other foot up with the hip and knee flexed. Repeat in an alternating fashion for 20-30 seconds."],"lvl":"beginner"},{"id":"jump-rope","n":"Jump Rope","eq":"other","p":["calves"],"s":["quads","forearms"],"pt":"locomotion","m":"comp","g":[],"how":["Hold an end of the rope in each hand. Position the rope behind you on the ground. Raise your arms up and turn the rope over your head bringing it down in front of you. When it reaches the ground, jump over it. Find a good turning pace that can be maintained. Different speeds and techniques can be used to introduce variation.","Rope jumping is exciting, challenges your coordination, and requires a lot of energy. A 150 lb person will burn about 350 calories jumping rope for 30 minutes, compared to over 450 calories running."],"lvl":"intermediate"},{"id":"burpee","n":"Burpee","eq":"bw","p":["quads"],"s":["chest","abs","frontdelt"],"pt":"locomotion","m":"comp","g":[]},{"id":"squat-jump","n":"Squat Jump","eq":"bw","p":["quads"],"s":["glutes","calves"],"pt":"squat","m":"comp","g":[],"how":["Cross your arms over your chest.","With your head up and your back straight, position your feet at shoulder width.","Keeping your back straight and chest up, squat down as you inhale until your upper thighs are parallel, or lower, to the floor.","Now pressing mainly with the ball of your feet, jump straight up in the air as high as possible, using the thighs like springs. Exhale during this portion of the movement.","When you touch the floor again, immediately squat down and jump again.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"split-squat-jump","n":"Split Squat Jump","eq":"bw","p":["quads"],"s":["glutes","calves"],"pt":"lunge","m":"comp","g":[],"how":["Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.","Ensure that the front knee is over the midline of the foot.","Extending through both legs, jump as high as possible, swinging your arms to gain lift.","As you jump, bring your feet together, and move them back to their initial positions as you land.","Absorb the impact by reverting back to the starting position."],"lvl":"beginner"},{"id":"kettlebell-swing","n":"Kettlebell Swing","eq":"kb","p":["glutes"],"s":["hams","lowback"],"pt":"hinge","m":"comp","g":[],"how":[],"lvl":"intermediate"},{"id":"box-jump","n":"Box Jump","eq":"other","p":["quads"],"s":["glutes","calves"],"pt":"squat","m":"comp","g":[],"how":["Begin with a box of an appropriate height 1-2 feet in front of you. Stand with your feet should width apart. This will be your starting position.","Perform a short squat in preparation for jumping, swinging your arms behind you.","Rebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.","Land on the box with the knees bent, absorbing the impact through the legs. You can jump from the box back to the ground, or preferably step down one leg at a time."],"lvl":"beginner"},{"id":"medicine-ball-slam","n":"Medicine Ball Slam","eq":"other","p":["abs"],"s":["lats","frontdelt"],"pt":"core","m":"comp","g":[],"how":["Start in a standing position with a staggered, athletic stance. Hold a medicine ball in one hand, on the same side as your back leg. This will be your starting position.","Begin by winding the arm, raising the medicine ball above your head. As you do so, extend through the hips, knees, and ankles to load up for the slam.","At peak extension, flex the shoulders, spine, and hips to throw the ball hard into the ground directly in front of you.","Catch the ball on the bounce and continue for the desired number of repetitions."],"lvl":"beginner"},{"id":"battle-ropes","n":"Battle Ropes","eq":"other","p":["frontdelt"],"s":["abs","forearms"],"pt":"locomotion","m":"comp","g":[],"how":["For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.","Initiate the movement by rapidly raising one arm to shoulder level as quickly as you can.","As you let that arm drop to the starting position, raise the opposite side.","Continue alternating your left and right arms, whipping the ropes up and down as fast as you can."],"lvl":"beginner"},{"id":"sprints","n":"Sprints","eq":"bw","p":["quads"],"s":["hams","glutes","calves"],"pt":"locomotion","m":"comp","g":[]},{"id":"running-in-place","n":"Running in Place","eq":"bw","p":["quads"],"s":["calves"],"pt":"locomotion","m":"comp","g":[]},{"id":"lunge-jump","n":"Lunge Jump","eq":"bw","p":["quads"],"s":["glutes","calves"],"pt":"lunge","m":"comp","g":[]},{"id":"lateral-bound","n":"Lateral Bound","eq":"bw","p":["glutes"],"s":["quads","calves"],"pt function tplFor(ex){
  if(ex.tpl&&T[ex.tpl])return T[ex.tpl];
  const n=ex.n.toLowerCase();
  for(const [re,id] of RULES){if(re.test(n)&&T[id]){let t=T[id];
    if(id==='front_raise'&&/alternating/.test(n))t=T.front_alt;
    return t}}
  return null;
}
function frameSvg(ex,e,w,h){
  const t=tplFor(ex);
  const inner=t?figureSvg(ex,t,e):'<text x="110" y="85" text-anchor="middle" font-size="12" fill="#5B6B78">No animation yet</text>';
  return `<svg class="anim" data-id="${ex.id}" viewBox="6 14 208 144" ${w?`width="${w}" height="${h}"`:''} role="img" aria-label="${esc(ex.n)} movement">${inner}</svg>`;
}
const easeIO=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function cycleE(ms){const c=(ms%2800)/2800;if(c<.1)return 0;if(c<.5)return easeIO((c-.1)/.4);if(c<.6)return 1;return easeIO(1-(c-.6)/.4)}
function animLoop(ts){
  const els=document.querySelectorAll('svg.anim[data-live]');
  if(els.length){const e=cycleE(ts);els.forEach(el=>{const ex=EXB[el.dataset.id];const t=ex&&tplFor(ex);if(t)el.innerHTML=figureSvg(ex,t,el.dataset.still?+el.dataset.still:e)})}
  requestAnimationFrame(animLoop);
}
if(typeof requestAnimationFrame!=='undefined'&&!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(animLoop);

function safetyItems(ex,d,k){

  if(eq==='cable')L.push('Check the pin and the attachment are fully locked before the first rep. Step back with control, do not let the stack slam.');

  if(pt==='pull')L.push('Pull your shoulder blades down and back before you pull with the arms. No swinging or jerking the weight.');

function tourCheck(){
  if(UI.tour||UI.sheet==='sched'||!S.onboarded||window.__NOTOUR||location.search.indexOf('notour')>-1)return;
  const k=tourKey();if(!TOURS[k]||tourSeen(k))return;

  clearTimeout(_tt);_tt=setTimeout(()=>{

function tourMount(){
  document.querySelectorAll('.tour').forEach(n=>n.remove());
  const T=UI.tour;if(!T)return;
  if(T.i>=T.steps.length){UI.tour=null;return}
  const st=T.steps[T.i],last=T.i===T.steps.length-1;
  const ov=document.createElement('div');ov.className='tour';
  ov.innerHTML=`<div class="tspot"></div><div class="tcard" role="dialog" aria-live="polite"><div class="sub">${T.i+1} of ${T.steps.length}</div><div class="tt">${esc(st.t)}</div><div class="tx">${esc(st.x)}</div><div class="row" style="gap:8px;margin-top:12px">${T.steps.length>1&&!last?'<button class="btn ghost sm" data-a="tourskip" style="width:auto;padding:0 12px">Skip tips</button>':''}<div class="sp1"></div><button class="btn sm" data-a="tournext" style="width:auto;padding:0 24px">${last?'Got it':'Next'}</button></div></div>`;
  document.body.appendChild(ov);
  const el=st.sel?document.querySelector(st.sel):null;
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});
  tourPlace();
}
function tourPlace(){
  const T=UI.tour;if(!T)return;const ov=document.querySelector('.tour');if(!ov)return;
  const st=T.steps[T.i],el=st.sel?document.querySelector(st.sel):null;
  const sp=ov.querySelector('.tspot'),cd=ov.querySelector('.tcard');
  const vh=window.innerHeight;
  if(!el){sp.style.display='none';ov.classList.add('dim');cd.style.top=Math.max(16,(vh-cd.offsetHeight)/2)+'px';cd.style.bottom='auto';return}
  ov.classList.remove('dim');sp.style.display='block';
  const r=el.getBoundingClientRect(),pad=6;
  sp.style.left=(r.left-pad)+'px';sp.style.top=(r.top-pad)+'px';sp.style.width=(r.width+pad*2)+'px';sp.style.height=(r.height+pad*2)+'px';
  const h=cd.offsetHeight,mid=r.top+r.height/2;
  let top=mid<vh/2?r.bottom+pad+14:r.top-pad-14-h;
  top=Math.max(12,Math.min(vh-h-12,top));
  cd.style.top=top+'px';cd.style.bottom='auto';
}
window.addEventListener('resize',()=>tourPlace());

const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function logSet(){
  const P=UI.play,st=P.steps[P.i],b=P.w.blocks[st.bi];const key=st.bi+':'+st.id;
  const lastSet=st.s===b.sets-1;
  const rec={w:P.cur.w,r:P.cur.r};if(b.tech&&lastSet)rec.tech=true;if(P.grip[st.id])rec.g=P.grip[st.id];
  (P.rec[key]=P.rec[key]||[]).push(rec);P.log.push(key);
  hap([45,30,45]);
  P.i++;P.tm=null;
  if(P.i>=P.steps.length){finishPlay();return}
  const nx=P.steps[P.i];
  // rest rules
  let secs=0,next='',burst='';
  if(st.ei<st.grp-1){secs=10;next='Switch to '+exName(nx.id)}
  else{secs=b.rest||60;if(nx&&nx.bi!==st.bi)next='Up next: '+exName(nx.id);if(b.burst)burst=b.burst}
  P.rest={end:NOW()+secs*1000,total:secs*1000,next,burst};
  initCur();render();
}
function finishPlay(){
  const P=UI.play;const exs=[];
  P.w.blocks.forEach((b,bi)=>b.ex.forEach(id=>{const sets=P.rec[bi+':'+id];if(sets&&sets.length)exs.push({id,sets})}));
  const dur=Math.max(1,Math.round((NOW()-P.start)/60000));
  const prs=[];
  exs.forEach(e=>{let best=0;e.sets.forEach(s=>{if(s.w>0)best=Math.max(best,e1rm(s.w,s.r))});if(best>0){const prev=S.prs[e.id];if(prev&&best>prev*1.0001&&!prs.includes(e.id))prs.push(e.id);if(!prev||best>prev)S.prs[e.id]=best}});
  const log={t:NOW(),title:P.w.title,parts:P.w.parts,kind:P.w.kind,mode:effMode(),goal:S.goal,dur,ex:exs,pr:prs,prog:!!P.w.prog};
  S.logs.push(log);
  if(P.w.prog&&S.program)S.program.pos++;
  if(S.custom)S.custom=null;
  const nb=checkBadges();
  save();
  UI.fin={log,prs,nb,vol:exs.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0),sets:exs.reduce((a,e)=>a+e.sets.length,0)};
  UI.play=null;UI.screen='finish';releaseLock();hap([60,40,60]);render();
}

function waterStats(){
  const days=[];for(let i=6;i>=0;i--){const t=NOW()-i*DAY;days.push({t,ml:waterOn(t)})}
  const avg=Math.round(days.reduce((a,d)=>a+d.ml,0)/7);
  let streak=0;for(let i=waterToday()>=S.waterGoal?0:1;i<400;i++){if(waterOn(NOW()-i*DAY)>=S.waterGoal)streak++;else break}
  const byDay={};S.water.forEach(w=>{const k=dkey(w.t);byDay[k]=(byDay[k]||0)+w.ml});
  const best=Object.values(byDay).reduce((a,b)=>Math.max(a,b),0);
  return {days,avg,streak,best};
}

const AVC=['#C8F169','#BFE3F5','#F7D6B5','#E3D3F5','#F5C9CF','#CFEFD9','#F3E7A6','#D5DCE3','#FAD7A0','#B9E4DC','#D9E6A8','#C9D5F5'];
const PRES=['lib','bolt','flame','shield','trophy','run','moon','bell','chart','glass','home','gear'];
const userIdx=x=>Math.max(0,U.list.findIndex(y=>y.id===x.id));
function avatarOf(name,pic,i,sz=40){
  const base=`width:${sz}px;height:${sz}px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;`;
  if(pic&&pic.indexOf('data:')===0)return `<span style="${base}background:#DDE5EA"><img src="${pic}" alt="" style="width:100%;height:100%;object-fit:cover"></span>`;
  if(pic&&pic.indexOf('i:')===0){const k=+pic.slice(2);return `<span style="${base}background:${AVC[k%AVC.length]}">${faceSvg(k%12,sz)}</span>`}
  return `<span style="${base}background:${AVC[i%AVC.length]};color:#12202B;font-weight:800;font-size:${sz*.42}px">${esc((name||'?').slice(0,1).toUpperCase())}</span>`;
}
const avatar=(x,i,sz=40)=>avatarOf(x.name,x.pic,i,sz);
/* Names may repeat: a duplicate is saved as "Name 2" instead of blocking the Create button. */
function uniqName(n,exceptId){n=n.trim();const used=x=>U.list.some(y=>y.id!==exceptId&&y.name.toLowerCase()===x.toLowerCase());if(!used(n))return n;let k=2;while(used(n+' '+k))k++;return n+' '+k}
function nameErr(n,exceptId){n=(n||'').trim();if(!n)return '';const u=uniqName(n,exceptId);return u!==n?'Another profile has this name. It will be saved as "'+u+'".':''}
function uCanSave(){const x=U.list.find(y=>y.id===UI.uview);const n=(UI.uname!==undefined?UI.uname:(x?x.name:'')).trim();if(!n)return false;if(!x)return true;return n!==x.name||(UI.upic!==undefined&&UI.upic!==(x.pic||null))}
function picPicker(name,cur,idx){
  return `<div style="display:flex;justify-content:center">${avatarOf(name||'?',cur,idx,84)}</div>
  <label class="btn out" style="cursor:pointer">${ico('plus',16)} Upload your photo<input type="file" id="upf" accept="image/*" style="display:none"></label>
  <div><div class="sec" style="text-align:center">Or pick a character</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px">${PRES.map((k,n)=>`<button data-a="upick" data-v="i:${n}" aria-label="Character ${n+1}" style="width:52px;height:52px;margin:0 auto;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;${cur==='i:'+n?'box-shadow:0 0 0 3px var(--ink);':''}">${avatarOf('',`i:${n}`,0,44)}</button>`).join('')}</div></div>

}

function rsRange(k){const n=NOW();if(k==='week'){const a=mondayOf(n);return [a,a+7*DAY]}const d=new Date(n);return [new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()]}
function rsCount(k){const [a,b]=rsRange(k),inn=x=>x.t>=a&&x.t<b;return {w:S.logs.filter(inn).length,h:S.water.filter(inn).length,m:(S.morn||[]).filter(inn).length+(S.wst||[]).filter(inn).length}}
function rsLine(c){return c.w+' workout'+(c.w===1?'':'s')+', '+c.h+' water entr'+(c.h===1?'y':'ies')+', '+c.m+' stretch session'+(c.m===1?'':'s')}

function pinHash(id,p){let h1=0xdeadbeef^id.length,h2=0x41c6ce57;const s=id+':gymmy:'+p;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const uById=id=>U.list.find(x=>x.id===id);
function padView(){
  const P=UI.pad,x=uById(P.id)||curUser(),k=Math.max(0,U.list.indexOf(x));
  const title=P.mode==='enter'?'Enter PIN':P.mode==='new'?'Choose a 4 digit PIN':'Enter it again';
  const sub=P.mode==='enter'?(P.then==='boot'?'Unlock '+esc(x.name):'PIN for '+esc(x.name)):esc(x.name);
  const wait=UI.pinlock&&UI.pinlock>NOW()&&P.mode==='enter'?Math.ceil((UI.pinlock-NOW())/1000):0;
  const dots=[0,1,2,3].map(i=>`<i class="pdot ${i<P.buf.length?'on':''}"></i>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9','','0','b'].map(c=>c===''?'<span></span>':`<button class="pkey" data-a="pk" data-v="${c}" ${wait?'disabled':''} aria-label="${c==='b'?'Delete':c}">${c==='b'?'&#9003;':c}</button>`).join('');
  const others=P.then==='boot'&&U.list.length>1?`<div class="sub" style="text-align:center">Not you? Switch profile</div><div class="pothers">${U.list.filter(u=>u.id!==x.id).map(u=>`<button class="pother" data-a="padswitch" data-v="${u.id}">${avatar(u,U.list.indexOf(u),40)}<small>${esc(u.name)}${u.pin?' (PIN)':''}</small></button>`).join('')}</div>`:'';
  return `<div class="padwrap"><div class="padbox">${avatar(x,k,72)}<div class="padt">${title}</div><div class="sub">${sub}</div><div class="pdots">${dots}</div><div class="perr" role="alert">${wait?'Too many tries. Wait '+wait+' seconds.':esc(P.err||'')}</div><div class="pkeys">${keys}</div>${others}${P.then!=='boot'?'<button class="btn ghost" data-a="padcancel">Cancel</button>':''}</div></div>`}
function padDone(){
  const P=UI.pad;if(!P||P.buf.length<4)return;const x=uById(P.id);if(!x){UI.pad=null;render();return}
  UI.unl=UI.unl||{};
  if(P.mode==='enter'){
    if(pinHash(x.id,P.buf)===x.pin){UI.unl[x.id]=1;UI.pinfail=0;const t=P.then;UI.pad=null;
      if(t==='switch'){ACT.switchuser(x.id);return}

      render();return}

    if(UI.pinfail>=5){UI.pinlock=NOW()+30000;UI.pinfail=0;setTimeout(()=>{if(UI.pad)render()},30500)}
    render();return}
  if(P.mode==='new'){P.first=P.buf;P.buf='';P.mode='new2';render();return}
  if(P.buf===P.first){x.pin=pinHash(x.id,P.buf);x.t=Date.now();UI.unl[x.id]=1;saveUsers();UI.pad=null;toast('PIN set');render()}
  else{P.buf='';P.first='';P.mode='new';P.err='PINs did not match. Try again.';hap([60,40,60]);render()}
}

const CLR='#86AE2B',CLR2='#B2E04A';
function logVol(l){return (l.ex||[]).reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.w||0)*(s.r||0),0),0)}
function logSets(l){return (l.ex||[]).reduce((a,e)=>a+e.sets.length,0)}
function logReps(l){return (l.ex||[]).reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.r||0),0),0)}
function bestE1(sets){let b=0;(sets||[]).forEach(s=>{if(s.w>0&&s.r>0)b=Math.max(b,e1rm(s.w,s.r))});return b}
function topSet(sets){let t=null;(sets||[]).forEach(s=>{if(s.w>0&&(!t||e1rm(s.w,s.r)>e1rm(t.w,t.r)))t=s});return t}
const sgn=n=>n>0?'+':'';
function pctTxt(p){return p==null?'':`${sgn(p)}${Math.round(p*10)/10}%`}
function deltaChip(p){if(p==null)return '';const c=p>0.4?'#4E7A12':p<-0.4?'#B3412F':'#5B6B78';return `<span style="color:${c};font-weight:700;font-size:12px">${p>0.4?'▲':p<-0.4?'▼':'•'} ${pctTxt(p)}</span>`}
/* --- charts --- */
function barsSvg(vals,labels,opt={}){
  const H=opt.h||90,W=300,n=vals.length,gap=6,bw=(W-gap*(n-1))/n,mx=Math.max(1,...vals);
  const bars=vals.map((v,i)=>{const h=Math.max(v?3:1.5,v/mx*H);const x=i*(bw+gap);const hi=opt.hi!=null&&i===opt.hi;
    return `<rect x="${x.toFixed(1)}" y="${(H-h+14).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5,bw/2).toFixed(1)}" fill="${v?(hi?CLR:CLR2):'#E3E8EE'}"/>${v?`<text x="${(x+bw/2).toFixed(1)}" y="${(H-h+10).toFixed(1)}" text-anchor="middle" font-size="9" fill="#5B6B78" font-weight="700">${opt.fmt?opt.fmt(v):v}</text>`:''}<text x="${(x+bw/2).toFixed(1)}" y="${H+28}" text-anchor="middle" font-size="9" fill="#8A97A2">${labels[i]||''}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="${esc(opt.label||'Chart')}">${bars}</svg>`;
}
function sparkSvg(vals,w=84,h=28){
  if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[2+i*(w-4)/(vals.length-1),h-3-(v-mn)/r*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${CLR}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="#4E7A12"/></svg>`;
}
function lineSvg(vals,labels,fmt){
  const W=300,H=96,n=vals.length;if(n<2)return '';
  const mn=Math.min(...vals,0),mx=Math.max(...vals,0),r=(mx-mn)||1;
  const X=i=>6+i*(W-12)/(n-1),Y=v=>20+(mx-v)/r*(H-34);
  const d=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  const area=d+`L${X(n-1).toFixed(1)} ${Y(0).toFixed(1)}L${X(0).toFixed(1)} ${Y(0).toFixed(1)}Z`;
  return `<svg viewBox="0 0 ${W} ${H+16}" width="100%" role="img" aria-label="Strength trend"><line x1="6" x2="${W-6}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#D3DBE1" stroke-dasharray="3 3"/><path d="${area}" fill="${CLR2}" opacity=".28"/><path d="${d}" fill="none" stroke="${CLR}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>i===n-1?`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="#4E7A12"/><text x="${(X(i)-4).toFixed(1)}" y="${(Y(v)-8).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="#4E7A12">${fmt(v)}</text>`:'').join('')}<text x="6" y="${H+12}" font-size="9" fill="#8A97A2">${labels[0]}</text><text x="${W-6}" y="${H+12}" text-anchor="end" font-size="9" fill="#8A97A2">${labels[labels.length-1]}</text></svg>`;
}

/* --- Progress and analytics --- */
function progressView(){
  const R=UI.prg||(UI.prg={r:12});const weeks=R.r;
  const m0=mondayOf(NOW());const start=m0-(weeks-1)*7*DAY;
  const logs=S.logs.filter(l=>l.t>=start&&l.kind!=='cardio');
  const all=S.logs.filter(l=>l.kind!=='cardio');
  const wkc=[],wkv=[],lab=[];
  for(let i=0;i<weeks;i++){const a=start+i*7*DAY,b=a+7*DAY;const w=S.logs.filter(l=>l.t>=a&&l.t<b);wkc.push(w.length);wkv.push(Math.round(w.reduce((s,l)=>s+logVol(l),0)*KG/100)/10);lab.push(weeks<=4||i%3===(weeks-1)%3?fmtDate(a).slice(0,6):'')}
  const planned=basePlanCount();
  const full=wkc.slice(0,-1);const hit=full.filter(n=>n>=planned).length;
  const sw=streakWeeks();
  const avg=Math.round(wkc.reduce((a,b)=>a+b,0)/weeks*10)/10;
  const mins=logs.reduce((a,l)=>a+(l.dur||0),0);
  // heat calendar
  const heat=[];for(let i=0;i<Math.min(weeks,12);i++){const a=m0-(Math.min(weeks,12)-1-i)*7*DAY;heat.push(Array.from({length:7},(_,d)=>{const t=a+d*DAY;return S.logs.filter(l=>l.t>=t&&l.t<t+DAY).length}))}
  const heatSvg=`<svg viewBox="0 0 ${heat.length*22} 160" width="100%" role="img" aria-label="Workout calendar">${['M','T','W','T','F','S','S'].map((d,i)=>`<text x="${heat.length*22/2}" y="0" fill="none"></text>`).join('')}${heat.map((col,x)=>col.map((n,y)=>`<rect x="${x*22+2}" y="${y*22+2}" width="18" height="18" rx="6" fill="${n>1?'#6F9A1E':n===1?CLR2:'#E3E8EE'}"/>`).join('')).join('')}</svg>`;
  // strength
  const lifts={};
  all.forEach(l=>(l.ex||[]).forEach(e=>{const b=bestE1(e.sets);if(b>0)(lifts[e.id]=lifts[e.id]||[]).push({t:l.t,v:b})}));
  const inR=Object.entries(lifts).map(([id,a])=>({id,all:a,pts:a.filter(p=>p.t>=start)})).filter(x=>x.pts.length>=2);

async function syncInit(){
  try{
    const c=window.claude;if(!c||!c.use)return;
    const db=await c.use('db'),user=await c.use('user');if(!db||!user)return;

    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){try{doPush();syncPushUsers(true)}catch(e){}}});
    addEventListener('pagehide',()=>{try{doPush();syncPushUsers(true)}catch(e){}});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SYNC.ready&&!UI.play){pullUsers().then(ch=>{if(ch)render()}).catch(()=>{});pullCur().then(ch=>{if(ch)render()}).catch(()=>{})}});
    setInterval(()=>{if(document.visibilityState==='visible'&&SYNC.ready&&!UI.play&&UI.screen!=='morning')pullUsers().then(ch=>{if(ch)render()}).catch(()=>{})},20000);

/* Profiles merge by id instead of last-write-wins, so a profile made on one device never wipes another device's list. */
function mergeUsers(r){
  const before=JSON.stringify([U.list,U.gone||[]]);
  const gone=new Set([...(U.gone||[]),...((r&&r.gone)||[])]);
  const loc=new Map(U.list.map(x=>[x.id,x]));const out=[];const seen=new Set();
  const rl=(r&&Array.isArray(r.list))?r.list:[];
  rl.forEach(x=>{if(gone.has(x.id)||seen.has(x.id))return;seen.add(x.id);const l=loc.get(x.id);out.push(l&&(l.t||0)>(x.t||0)?l:(l?Object.assign({},l,x):x))});
  U.list.forEach(x=>{if(gone.has(x.id)||seen.has(x.id))return;seen.add(x.id);out.push(x)});
  if(out.length){U.list=out.slice(0,MAXU+5)}
  U.gone=[...gone].slice(-60);if(!U.list.find(u=>u.id===U.cur))U.cur=U.list[0].id;KEY=keyFor(U.cur);
  return JSON.stringify([U.list,U.gone])!==before;
}
async function pullUsers(){
  const s=await sCol().doc('gm_users').get();if(!s.exists)return false;
  const r=s.data();if(!r)return false;
  const ch=mergeUsers(r);

  return ch;
}
async function pullCur(){
  const id=U.cur;const s=await sCol().doc('gm_'+id).get();if(!s.exists)return false;
  const m=s.data();if(!m||(m.t||0)<=(S._t||0))return false;
  let str='';for(let i=0;i<(m.n||0);i++){const c=await sCol().doc('gm_'+id+'_'+i).get();if(!c.exists)return false;str+=c.data().d}
  if(str.length!==m.len)return false;
  const o=JSON.parse(str);if(!o||!Array.isArray(o.logs))return false;
  if(id!==U.cur)return false;
  S=Object.assign(DEFAULT_STATE(),o);S.set=Object.assign(DEFAULT_STATE().set,o.set||{});S.tour=Object.assign({},S.tour,TSEEN);S._t=m.t;restoreGoal();migrate();

}
function syncPush(now){
  if(!SYNC.ready)return;clearTimeout(SYNC.tm);SYNC.tm=setTimeout(doPush,now?50:2500);

async function doPush(){
  if(SYNC.busy){SYNC.tm=setTimeout(doPush,1500);return}
  if(!S._t){return}
  SYNC.busy=true;const id=U.cur,t=S._t;
  try{
    const m=await sCol().doc('gm_'+id).get();if(m.exists&&(m.data().t||0)>=t){return}
    setSync('busy');const str=JSON.stringify(S);const n=Math.ceil(str.length/CH)||1;
    for(let i=0;i<n;i++)await sCol().doc('gm_'+id+'_'+i).set({d:str.slice(i*CH,(i+1)*CH)});
    await sCol().doc('gm_'+id).set({t,n,len:str.length});
    SYNC.last=Date.now();setSync('on');
  }catch(e){setSync('err');SYNC.tm=setTimeout(doPush,15000)}finally{SYNC.busy=false}
}

}

function sampleData(){
  const old=S.logs.length;const plan=basePlan();
  for(let i=20;i>=1;i--){const t=startOfDay(NOW()-i*DAY)+18*HR;const parts=plan[wkIdx(t)];if(!parts.length||i%7===3)continue;
    const g=genGuide(parts,S.goal,{noGuard:true});const exs=[];
    g.blocks.forEach(b=>b.ex.forEach(id=>{const e=EXB[id];const base={bb:42,db:14,cable:25,mach:38,smith:35,bw:0,band:0,kb:14,other:15}[e.eq]*(e.m==='comp'?1.4:1)*(1+(20-i)*0.006);const w=e.eq==='bw'||e.eq==='band'?0:Math.round(base*2)/2;const sets=[];for(let s=0;s<b.sets;s++)sets.push({w,r:Math.max(6,numFirst(b.reps)-(s>1?1:0))});exs.push({id,sets})}));
    S.logs.push({t,title:g.title,parts,kind:'guide',mode:'gym',goal:S.goal,dur:48+(i%4)*4,ex:exs,pr:i===9?[exs[0].id]:[],sample:true});
    exs.forEach(e=>{const b=Math.max(...e.sets.map(s=>s.w>0?e1rm(s.w,s.r):0));if(b>0&&(!S.prs[e.id]||b>S.prs[e.id]))S.prs[e.id]=b});
  }
  S.logs.sort((a,b)=>a.t-b.t);
  for(let i=6;i>=0;i--){const t=startOfDay(NOW()-i*DAY)+9*HR;[250,500,250,150].slice(0,2+(i%3)).forEach((ml,k)=>S.water.push({t:t+k*3*HR,ml}))}
  S.onboarded=true;checkBadges();save();
}

/* Haptics: every press gets a tick, strength depends on the control */
const HAP_STRONG=/^(wstart|prog-start|startplay|pl-done|pl-log|logset|finishdone|mfinish|cardio-save|wskip|start|begin|save|sched-save|obnext)/;
const HAP_WARN=/(quit|delete|del|reset|clear|remove|discard|wipe|signout)/;
const HAP_SOFT=/^(tog|theme|goal|mflip|libf|chip|seg|tab|nav|wd|water\+|wchip|wtile)/;
function hapFor(el){const a=el.dataset.a||'';
  if(HAP_WARN.test(a))return [35,45,35];
  if(HAP_STRONG.test(a)||el.classList.contains('primary')||el.classList.contains('hero'))return [55];
  if(el.closest('.nav'))return [22];
  if(a==='wd'||a==='rd')return [26];
  if(HAP_SOFT.test(a)||el.classList.contains('chip')||el.classList.contains('seg'))return [18];
  return [32]}
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-a],button,.chip');if(!el||el.disabled)return;
  hap(hapFor(el))},true);
document.addEventListener('keydown',e=>{
  const t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName))return;
  if(e.key==='Enter'&&t.id==='un'){e.preventDefault();ACT.usave();return}
  if(e.key==='Enter')hap([30,30,30]);else if(e.key==='Backspace')hap(14);else if(e.key.length===1)hap(10)});

}
