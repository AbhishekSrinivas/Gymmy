<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F6F8">
<title>Gymmy</title>
<style>
@font-face{font-family:'DM Sans';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
html{color-scheme:light dark}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--bg:#F3F6F8;--card:#FFFFFF;--ink:#0E0F11;--tx:#12202B;--mut:#5B6B78;--line:#E4EAEE;--lime:#C8F169;--limed:#2C3A10;--blue:#3D6FA0;--blueb:#E6EEF6;--amber:#C77700;--amberb:#FFF1D6;--red:#B3412F;--redb:#FBE7E2;--grn:#4E7A12;--grnb:#EEF3E1;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.4 'DM Sans',system-ui,-apple-system,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--tx)}
h1,h2,h3,p{margin:0}
#app{max-width:520px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.hide-nav #app{padding-bottom:30px}
.top{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:12px}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn svg{display:block}
.h1{font-size:22px;font-weight:700;line-height:1.1}
.sub{font-size:13px;color:var(--mut)}
.pill{background:var(--ink);color:var(--lime);border-radius:14px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.sp1{flex:1;min-width:0}
.wk{display:flex;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:12px 6px}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:6px;width:44px;font-size:12px;color:var(--mut)}
.dot{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:10px}
.dot.done{background:var(--ink)}.dot.rest{border:2px dashed var(--mut);width:30px;height:30px;color:var(--mut)}.dot.now{border:3px solid var(--ink);width:30px;height:30px;font-weight:700;color:var(--ink)}.dot.fut{background:var(--line);width:30px;height:30px}.dot.away{background:var(--amberb);color:var(--amber);font-weight:700}
.hero{background:var(--lime);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero .k{font-size:12px;letter-spacing:1.5px;font-weight:700;color:var(--limed)}
.big{font-family:'Barlow Condensed','DM Sans',sans-serif;font-weight:700;font-size:52px;line-height:.92;text-transform:uppercase;overflow-wrap:anywhere}
.big.sm{font-size:40px}
.hero .m{font-size:14px;color:var(--limed)}
.btn{height:52px;border-radius:14px;background:var(--ink);color:var(--lime);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.out{background:var(--card);color:var(--tx);border:1px solid #C9D3DA;font-weight:500;font-size:14px;height:44px}
.btn.sm{height:40px;font-size:14px;border-radius:12px}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--mut);font-weight:500;height:40px;font-size:14px}
.btn[disabled]{opacity:.4}
.tl{font-size:13px;color:var(--tx);background:var(--card);border-radius:14px;padding:10px 14px}
.tl.roast{background:var(--limed);color:var(--lime)}
.tl.away{background:var(--amberb);color:#6B4300}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-height:84px;text-align:left;width:100%}
.mini .t{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:500}
.mini .t b{flex:1;font-weight:500}
.mini .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini .v{font-size:20px;font-weight:700;margin-top:2px}
.mini .s{font-size:12px;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.bar.b>i{background:var(--blue)}.bar.am>i{background:var(--amber)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px);z-index:20}
.nav>div{max-width:520px;margin:0 auto;height:76px;display:flex;justify-content:space-around;align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:#8A9099;font-size:12px;font-weight:500;min-width:72px;padding:6px 0}
.nav button.on{color:var(--lime);font-weight:700}
.hide-nav .nav{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;border-radius:17px;padding:0 14px;background:var(--card);border:1px solid #D3DBE1;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--lime);border-color:var(--ink);font-weight:700}
.chip.sm{height:26px;font-size:12px;padding:0 10px;border-radius:13px;background:var(--line);border:none;color:var(--tx)}
.chip.sm.l{background:#EAF6C6}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;height:38px;border-radius:11px;font-size:13px;color:var(--mut);font-weight:500}
.tabs button.on{background:var(--ink);color:var(--lime);font-weight:700}
.search{width:100%;height:44px;border-radius:14px;border:1px solid #D3DBE1;background:var(--card);padding:0 14px;font-size:15px}
.exrow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px;text-align:left;width:100%}
.exrow .th{width:76px;height:54px;border-radius:10px;background:var(--line);overflow:hidden;flex-shrink:0}
.exrow .n{font-weight:700;font-size:14px;line-height:1.2}
.exrow .d{font-size:12px;color:var(--mut)}
.sp{background-size:200% 100%;background-repeat:no-repeat;animation:spf 1.6s step-end infinite;width:100%;height:100%;background-color:#fff}
@keyframes spf{0%{background-position:0 0}50%{background-position:100% 0}}
.sp.nomo{animation:none}
.vis{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.vis .sp{aspect-ratio:3/2;height:auto}
.sheetbg{position:fixed;inset:0;background:rgba(14,15,17,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@keyframes fi{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
.sheet.ink{background:var(--ink);color:#F2F4F5}
.grab{width:40px;height:4px;border-radius:2px;background:#C9D3DA;margin:2px auto 12px}
.sheet.ink .grab{background:#3A3F46}
.drawerbg{position:fixed;inset:0;background:rgba(14,15,17,.5);z-index:45}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(340px,88vw);background:var(--bg);z-index:46;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px;display:flex;flex-direction:column;gap:12px}
@keyframes sl{from{transform:translateX(-30px);opacity:.4}}
.seg{display:flex;background:#E4EAEE;border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--ink);color:var(--lime);font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.lrow .ic{width:34px;height:34px;border-radius:11px;background:#EEF3E1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow b{font-weight:700;display:block}.lrow small{color:var(--mut);font-size:12px;display:block}
.tg{width:44px;height:26px;border-radius:13px;background:#C9D3DA;position:relative;flex-shrink:0;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .15s}
.tg.on{background:var(--ink)}.tg.on::after{left:21px;background:var(--lime)}
.sec{font-size:12px;letter-spacing:1.2px;color:var(--mut);font-weight:700;text-transform:uppercase;padding:6px 2px 0}
.wcard{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.wcard .d{width:50px;text-align:center;flex-shrink:0}.wcard .d b{display:block;font-size:12px;color:var(--mut)}.wcard .d span{font-size:20px;font-weight:700}
.wcard.today{outline:3px solid var(--ink)}
.wcard.rest{background:transparent;border:2px dashed #B8C4CC}
.st{font-size:11px;font-weight:700;border-radius:10px;padding:3px 8px;background:var(--line);color:var(--mut)}
.st.done{background:var(--ink);color:var(--lime)}.st.now{background:var(--lime);color:var(--limed)}.st.away{background:var(--amberb);color:var(--amber)}
.note{font-size:12px;color:#6B4300;background:var(--amberb);border-radius:12px;padding:8px 12px}
.note.g{background:var(--grnb);color:var(--grn)}
.stepper{display:flex;align-items:center;gap:6px;background:#F3F6F8;border-radius:12px;padding:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--card);font-size:20px;font-weight:700;line-height:1}
.stepper input{width:100%;min-width:0;text-align:center;font-size:24px;font-weight:700;border:none;background:transparent;padding:0}
.big2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1.02;text-transform:uppercase}
.restp{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px}
.restp .t{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:700;line-height:1;color:var(--lime)}
.prog{display:flex;gap:3px}.prog i{flex:1;height:5px;border-radius:3px;background:#D3DBE1}.prog i.on{background:var(--ink)}.prog i.cur{background:var(--lime);outline:1px solid var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--lime);padding:12px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:60;max-width:min(460px,92vw);animation:fi .2s;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hide-nav .toast{bottom:30px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:55}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:cf 2.8s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
.fig{width:100%;height:auto;max-height:340px}
.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);flex-wrap:wrap}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.badge{background:var(--card);border-radius:14px;padding:10px;text-align:center;font-size:11px;color:var(--mut)}
.badge.on{background:var(--lime);color:var(--limed);font-weight:700}
.badge svg{display:block;margin:0 auto 4px}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--mut);font-weight:700}
.field input,.field select,.field textarea{height:44px;border-radius:12px;border:1px solid #D3DBE1;background:var(--card);padding:0 12px;width:100%}
.field textarea{height:120px;padding:10px 12px;font:12px/1.3 ui-monospace,monospace}
.eqg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eq{background:var(--card);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;position:relative}
.eq.on{border-color:var(--ink)}
.eq .pic{height:64px;border-radius:12px;background:#EEF3E1;display:flex;align-items:center;justify-content:center}
.eq b{font-size:14px}.eq small{font-size:11px;color:var(--mut);line-height:1.25}
.eq .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:12px;background:var(--ink);display:none;align-items:center;justify-content:center}
.eq.on .ck{display:flex}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.ink .mut,.sheet.ink .sub{color:#9AA6B2}
.wq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wq button{background:#1D2126;border-radius:14px;padding:10px 4px;color:#F2F4F5;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wq button small{font-weight:400;font-size:11px;color:#9AA6B2}
.how li{margin-bottom:6px}
.how{padding-left:20px;margin:0;font-size:13px;color:#2B3A45}
@media (prefers-reduced-motion:reduce){.sp{animation:none}.conf{display:none}}

@keyframes xf{0%,12%{opacity:0}45%,57%{opacity:1}90%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sp2 i:last-child{animation:none;opacity:0}}

.pill,.st,.chip,.chip.sm{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.pill{min-height:30px}.st{min-height:22px}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.seg button,.tabs button{display:flex;align-items:center;justify-content:center;text-align:center}
.animbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.animbox svg.anim{display:block;width:100%;height:auto;max-height:260px}
.animcap{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:700;color:#4F6E10;background:#EAF7C8;border-radius:999px;padding:3px 10px}
.th svg.anim{width:100%;height:100%}
.gdet{background:var(--card);border-radius:14px;padding:12px 14px}.gsum{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.pl2,.plL,.plR{display:contents}
@media (min-width:760px) and (orientation:landscape),(min-width:1000px){
 #app{max-width:1180px;padding-left:100px;padding-right:20px}
 .nav{top:0;right:auto;width:84px;padding:0;border-radius:0 22px 22px 0}
 .nav>div{height:100%;max-width:none;flex-direction:column;justify-content:center;gap:14px;margin:0}

}

.rbar{height:6px;border-radius:3px;background:#D3DBE1;overflow:hidden}.rbar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}

@media (min-width:760px) and (orientation:landscape),(min-width:1000px){.hm>.morn{grid-column:1;grid-row:1}.hm>.hero{grid-row:2/span 2}}

.tour{position:fixed;inset:0;z-index:90}
.tour.dim{background:rgba(14,15,17,.62)}

/* ===== Modern pass ===== */
:root{--r:20px;--sh1:0 1px 2px rgba(16,32,43,.05),0 10px 28px -14px rgba(16,32,43,.18);--sh2:0 2px 4px rgba(16,32,43,.06),0 18px 40px -16px rgba(16,32,43,.28)}
html,body{background:linear-gradient(180deg,#F6F9FB 0,#EDF2F5 100%) fixed,var(--bg)}
body{letter-spacing:-.005em}
.card,.mini,.wk,.tl,.ibtn,.gdet,.tabs{box-shadow:var(--sh1);border:1px solid rgba(228,234,238,.7)}
.card{padding:16px 18px}
.h1{letter-spacing:-.02em}
.hero{background:radial-gradient(120% 90% at 100% 0,#E4FA9C 0,transparent 55%),linear-gradient(145deg,#C8F169 0,#A9DB43 100%);box-shadow:var(--sh2),inset 0 1px 0 rgba(255,255,255,.5);border-radius:28px}

.btn:active,.chip:active,.mini:active,.ibtn:active,.seg button:active{transform:scale(.97)}
.btn.out{background:var(--card);box-shadow:var(--sh1);border:1px solid #D7DFE5}
.btn.lime{background:linear-gradient(180deg,#D4F67F,#BCE857);color:var(--ink)}
.btn.ghost{box-shadow:none;background:transparent;border:0}
.chip{box-shadow:0 1px 2px rgba(16,32,43,.05);transition:transform .12s,background .15s}
.chip.on,.seg button.on,.tabs button.on{background:linear-gradient(180deg,#1B1D21,#0E0F11);box-shadow:0 4px 10px -4px rgba(14,15,17,.5)}
.seg{background:#E3EAEF;box-shadow:inset 0 1px 2px rgba(16,32,43,.08)}
.mini{border-radius:22px}
.mini .ic{border-radius:14px}

.btn .dic,.chip .dic,.seg button .dic,.tabs button .dic{margin-right:0}
.seg button,.tabs button,.btn,.chip{gap:6px}
.sec.hasic{display:flex;align-items:center;gap:8px}

.btn .dic{opacity:.95}
.tour .dic{display:none}

bar back in the rack."],"lvl":"beginner"},{"id":"close-grip-incline-press","n":"Close-Grip Incline Press","eq":"bb","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":["Close"]},{"id":"decline-bench-press","n":"Decline Bench Press","eq":"bb","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":["Medium"],"how":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"lvl":"beginner"},{"id":"dumbbell-bench-press","n":"Dumbbell Bench Press","eq":"db","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":["Neutral","Pronated"],"how":["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.","Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions of your training program."],"lvl":"beginner"},{"id":"incline-dumbbell-press","n":"Incline Dumbbell Press","eq":"db","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":["Pronated","Neutral"],"how":["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"reverse-grip-incline-dumbbell-press","n":"Reverse-Grip Incline Dumbbell Press","eq":"db","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":["Reverse"]},{"id":"static-dumbbell-press","n":"Static Dumbbell Press","eq":"db","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":[]},{"id":"underhand-chest-press","n":"Underhand Chest Press","eq":"bb","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":["Underhand"]},{"id":"close-grip-bench-press","n":"Close-Grip Bench Press","eq":"bb","p":["triceps"],"s":["chest","frontdelt"],"pt":"push","m":"comp","g":["Close"],"how":["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"lvl":"beginner"},{"id":"close-grip-landmine-press","n":"Close-Grip Landmine Press","eq":"other","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":[]},{"id":"one-arm-leverage-incline-press","n":"One-Arm Leverage Incline Press","eq":"mach","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":[],"how":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"lvl":"beginner"},{"id":"dumbbell-fly","n":"Dumbbell Fly","eq":"db","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.","Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"incline-dumbbell-fly","n":"Incline Dumbbell Fly","eq":"db","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["Hold a dumbbell on each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"bent-over-cable-fly","n":"Bent-Over Cable Fly","eq":"cable","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[]},{"id":"cable-crossover","n":"Cable Crossover","eq":"cable","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.","Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the starting position and repeat the movement for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"incline-cable-fly","n":"Incline Cable Fly","eq":"cable","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["To get yourself into the starting position, set the pulleys at the floor level (lowest level possible on the machine that is below your torso).","Place an incline bench (set at 45 degrees) in between the pulleys, select a weight on each one and grab a pulley on each hand.","With a handle on each hand, lie on the incline bench and bring your hands together at arms length in front of your face. This will be your starting position.","With a slight bend of your elbows (in order to prevent stress at the biceps tendon), lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary. The movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and exhale. Hold the contracted position for a second. Tip: Make sure to use the same arc of motion used to lower the weights.","Repeat the movement for the prescribed amount of repetitions."],"lvl":"intermediate"},{"id":"high-to-low-cable-fly","n":"High-to-Low Cable Fly","eq":"cable","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[]},{"id":"3-d-cable-crossover","n":"3-D Cable Crossover","eq":"cable","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.","Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the starting position and repeat the movement for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"standing-cable-press","n":"Standing Cable Press","eq":"cable","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":[],"how":["Position dual pulleys to chest height and select an appropriate weight. Stand a foot or two in front of the cables, holding one in each hand. You can stagger your stance for better stability.","Position the upper arm at a 90 degree angle with the shoulder blades together. This will be your starting position.","Keeping the rest of the body stationary, extend through the elbows to press the handles forward, drawing them together in front of you.","Pause at the top of the motion, and return to the starting position."],"lvl":"beginner"},{"id":"standing-cable-lower-chest-press","n":"Standing Cable Lower Chest Press","eq":"cable","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":[],"how":["Position dual pulleys to chest height and select an appropriate weight. Stand a foot or two in front of the cables, holding one in each hand. You can stagger your stance for better stability.","Position the upper arm at a 90 degree angle with the shoulder blades together. This will be your starting position.","Keeping the rest of the body stationary, extend through the elbows to press the handles forward, drawing them together in front of you.","Pause at the top of the motion, and return to the starting position."],"lvl":"beginner"},{"id":"kneeling-x-press","n":"Kneeling X Press","eq":"cable","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":[]},{"id":"pec-deck-fly","n":"Pec Deck Fly","eq":"mach","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"d2-flexion-crossover","n":"D2 Flexion Crossover","eq":"band","p":["chest"],"s":["frontdelt"],"pt":"push","m":"iso","g":[]},{"id":"chest-dip","n":"Chest Dip","eq":"bw","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":["Wide"],"how":["For this exercise you will need access to parallel bars. To get yourself into the starting position, hold your body at arms length (arms locked) above the bars.","While breathing in, lower yourself slowly with your torso leaning forward around 30 degrees or so and your elbows flared out slightly until you feel a slight stretch in the chest.","Once you feel the stretch, use your chest to bring your body back to the starting position as you breathe out. Tip: Remember to squeeze the chest at the top of the movement for a second.","Repeat the movement for the prescribed amount of repetitions."],"lvl":"intermediate"},{"id":"weighted-dip","n":"Weighted Dip","eq":"bw","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":[],"how":["For this exercise you will need access to parallel bars. To get yourself into the starting position, hold your body at arms length (arms locked) above the bars.","While breathing in, lower yourself slowly with your torso leaning forward around 30 degrees or so and your elbows flared out slightly until you feel a slight stretch in the chest.","Once you feel the stretch, use your chest to bring your body back to the starting position as you breathe out. Tip: Remember to squeeze the chest at the top of the movement for a second.","Repeat the movement for the prescribed amount of repetitions."],"lvl":"intermediate"},{"id":"dip-plus","n":"Dip Plus","eq":"bw","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":[]},{"id":"straight-bar-dip","n":"Straight Bar Dip","eq":"bb","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":[]},{"id":"decline-cable-dip","n":"Decline Cable Dip","eq":"cable","p":["chest"],"s":["triceps"],"pt":"push","m":"comp","g":[]},{"id":"jackhammer-pushdown","n":"Jackhammer Pushdown","eq":"cable","p":["chest"],"s":["triceps"],"pt":"push","m":"iso","g":[]},{"id":"pushup","n":"Pushup","eq":"bw","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":["Standard","Wide","Narrow","Neutral"],"how":["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."],"lvl":"beginner"},{"id":"incline-pushup","n":"Incline Pushup","eq":"bw","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":[],"how":["Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width.","Position forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body. Keeping body straight, lower chest to edge of box or platform by bending arms.","Push body up until arms are extended. Repeat."],"lvl":"beginner"},{"id":"feet-elevated-pushup","n":"Feet-Elevated Pushup","eq":"bw","p":["chest"],"s":["triceps","frontdelt"],"pt":"push","m":"comp","g":[],"how":["Lie on the floor face down and place your hands about 36 inches apart from each other holding your torso up at arms length.","Place your toes on top of a flat bench. This will allow your body to be elevated. Note: The higher the elevation of the flat bench, the higher the resistance of the exercise is.","Lower yourself until your chest almost touches the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"diamond-pushup","n":"Diamond Pushup","eq":"bw","p":["triceps"],"s":["chest","frontdelt"],"pt":"push","m":"comp","g":[]},{"id":"incline-twisting-pushup","n":"Incline Twisting Pushup","eq":"bb","p":["chest"],"s":["triceps","obliques"],"pt":"push","m":"comp","g":[]},{"id":"isometric-pushup-hold","n":"Isometric Pushup Hold","eq":"bw","p":["chest"],"s":["triceps","abs"],"pt":"push","m":"iso","g":[]},{"id":"superman-pushup","n":"Superman Pushup","eq":"bw","p":["chest"],"s":["triceps","glutes"],"pt":"push","m":"comp","g":[]},{"id":"close-grip-pushup","n":"Close-Grip Pushup","eq":"bw","p":["triceps"],"s":["chest"],"pt":"push","m":"comp","g":[],"how":["Lie on the floor face down and body straight with your toes on the floor and the hands wider than shoulder width for a wide hand position and closer than shoulder width for a close hand position. Make sure you are holding your torso up at arms length.","Lower yourself until your chest almost touches the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"pushup-to-side-plank","n":"Pushup to Side Plank","eq":"bw","p":["chest"],"s":["obliques","triceps"],"pt":"push","m":"comp","g":[],"how":["Get into pushup position on the toes with your hands just outside of shoulder width.","Perform a pushup by allowing the elbows to flex. As you descend, keep your body straight.","Do one pushup and as you come up, shift your weight on the left side of the body, twist to the side while bringing the right arm up towards the ceiling in a side plank.","Lower the arm back to the floor for another pushup and then twist to the other side.","Repeat the series, alternating each side, for 10 or more reps."],"lvl":"beginner"},{"id":"pull-up","n":"Pull-Up","eq":"bw","p":["lats"],"s":["biceps","midback"],"pt":"pull","m":"comp","g":["Wide","Close Neutral","Underhand"],"how":["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"assisted-pull-up","n":"Assisted Pull-Up","eq":"mach","p":["lats"],"s":["biceps","midback"],"pt":"pull","m":"comp","g":["Wide","Neutral","Underhand"],"how":["Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.","Pull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.","Pull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.","After a brief pause, return to the starting position."],"lvl":"beginner"},{"id":"weighted-pull-up","n":"Weighted Pull-Up","eq":"bw","p":["lats"],"s":["biceps","midback"],"pt":"pull","m":"comp","g":[],"how":["Attach a weight to a dip belt and secure it around your waist. Grab the pull-up bar with the palms of your hands facing forward. For a medium grip, your hands should be spaced at shoulder width. Both arms should be extended in front of you holding the bar at the chosen grip.","You'll want to bring your torso back about 30 degrees while creating a curvature in your lower back and sticking your chest out. This will be your starting position.","Now, exhale and pull your torso up until your head is above your hands. Concentrate on squeezing yourshoulder blades back and down as you reach the top contracted position.","After a brief moment at the top contracted position, inhale and slowly lower your torso back to the starting position with your arms extended and your lats fully stretched."],"lvl":"intermediate"},{"id":"chin-up","n":"Chin-Up","eq":"bw","p":["lats"],"s":["biceps"],"pt":"pull","m":"comp","g":["Underhand"],"how":["Grab the pull-up bar with the palms facing your torso and a grip closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, keep your torso as straight as possible while creating a curvature on your lower back and sticking your chest out. This is your starting position. Tip: Keeping the torso as straight as possible maximizes biceps stimulation while minimizing back involvement.","As you breathe out, pull your torso up until your head is around the level of the pull-up bar. Concentrate on using the biceps muscles in order to perform the movement. Keep the elbows close to your body. Tip: The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second of squeezing the biceps in the contracted position, slowly lower your torso back to the starting position; when your arms are fully extended. Breathe in as you perform this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"wide-grip-pulldown","n":"Wide-Grip Pulldown","eq":"cable","p":["lats"],"s":["biceps","reardelt"],"pt":"pull","m":"comp","g":["Wide"],"how":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"behind-neck-pulldown","n":"Behind-Neck Pulldown","eq":"cable","p":["lats"],"s":["biceps","reardelt"],"pt":"pull","m":"comp","g":["Wide"],"how":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso and head forward. Think of an imaginary line from the center of the bar down to the back of your neck. This is your starting position.","As you breathe out, bring the bar down until it touches the back of your neck by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second on the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"lvl":"intermediate"},{"id":"reverse-grip-pulldown","n":"Reverse-Grip Pulldown","eq":"cable","p":["lats"],"s":["biceps"],"pt":"pull","m":"comp","g":["Underhand"],"how":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"standing-pulldown","n":"Standing Pulldown","eq":"cable","p":["lats"],"s":["biceps"],"pt":"pull","m":"comp","g":[],"how":["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.","Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.","While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.","While keeping the arms straight, go back to the starting position while breathing in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"straight-arm-pulldown","n":"Straight-Arm Pulldown","eq":"cable","p":["lats"],"s":[],"pt":"pull","m":"iso","g":[],"how":["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.","Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.","While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.","While keeping the arms straight, go back to the starting position while breathing in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"rope-straight-arm-pushdown","n":"Rope Straight-Arm Pushdown","eq":"cable","p":["lats"],"s":[],"pt":"pull","m":"iso","g":[],"how":["Attach a rope to a high pulley and make your weight selection. Stand a couple feet back from the pulley with your feet staggered and take the rope with both hands. Lean forward from the hip, keeping your back straight, with your arms extended up in front of you. This will be your starting position.","Keeping your arms straight, extend the shoulder to pull the rope down to your thighs.","Pause at the bottom of the motion, squeezing your lats.","Return to the starting position without allowing the weight to fully rest on the stack."],"lvl":"beginner"},{"id":"close-grip-v-bar-pulldown","n":"Close-Grip V-Bar Pulldown","eq":"cable","p":["lats"],"s":["biceps"],"pt":"pull","m":"comp","g":["Close Neutral"],"how":["Sit down on a pull-down machine with a V-Bar attached to the top pulley.","Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.","Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement.","After a second hold on the contracted position, slowly bring the bar back to the starting position as you breathe in.","Repeat for the prescribed number of repetitions."],"lvl":"intermediate"},{"id":"seated-underhand-pulldown","n":"Seated Underhand Pulldown","eq":"cable","p":["lats"],"s":["biceps"],"pt":"pull","m":"comp","g":["Underhand"],"how":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"underhand-cable-pulldown","n":"Underhand Cable Pulldown","eq":"cable","p":["lats"],"s":["biceps"],"pt":"pull","m":"comp","g":["Underhand"],"how":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-pullover","n":"Dumbbell Pullover","eq":"db","p":["lats"],"s":["chest","triceps"],"pt":"pull","m":"comp","g":[],"how":["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.","Grasp the dumbbell with both hands and hold it straight over your chest with a bend in your arms. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.","While keeping your arms locked in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],"lvl":"intermediate"},{"id":"bent-arm-dumbbell-pullover","n":"Bent-Arm Dumbbell Pullover","eq":"db","p":["lats"],"s":["chest","triceps"],"pt":"pull","m":"comp","g":[],"how":["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.","Grasp the dumbbell with both hands and hold it straight over your chest with a bend in your arms. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.","While keeping your arms locked in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],"lvl":"intermediate"},{"id":"dumbbell-bent-over-row","n":"Dumbbell Bent-Over Row","eq":"db","p":["midback"],"s":["lats","biceps","reardelt"],"pt":"pull","m":"comp","g":["Neutral"],"how":["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"bent-over-barbell-row","n":"Bent-Over Barbell Row","eq":"bb","p":["midback"],"s":["lats","biceps","lowback"],"pt":"pull","m":"comp","g":["Overhand","Underhand"],"how":["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"single-arm-dumbbell-row","n":"Single-Arm Dumbbell Row","eq":"db","p":["lats"],"s":["midback","biceps"],"pt":"pull","m":"comp","g":["Neutral"],"how":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions."],"lvl":"beginner"},{"id":"45-degree-incline-dumbbell-row","n":"45-Degree Incline Dumbbell Row","eq":"db","p":["midback"],"s":["lats","biceps","reardelt"],"pt":"pull","m":"comp","g":[],"how":["Using a neutral grip, lean into an incline bench.","Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.","Retract the shoulder blades and flex the elbows to row the dumbbells to your side.","Pause at the top of the motion, and then return to the starting position."],"lvl":"beginner"},{"id":"seated-cable-row","n":"Seated Cable Row","eq":"cable","p":["midback"],"s":["lats","biceps"],"pt":"pull","m":"comp","g":["Neutral","Wide"],"how":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"seated-close-grip-cable-row","n":"Seated Close-Grip Cable Row","eq":"cable","p":["midback"],"s":["lats","biceps"],"pt":"pull","m":"comp","g":["Close Neutral"],"how":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"single-arm-high-cable-row","n":"Single-Arm High Cable Row","eq":"cable","p":["lats"],"s":["midback","biceps"],"pt":"pull","m":"comp","g":[],"how":["Attach a single handle to a high pulley and make your weight selection.","Kneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.","Starting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.","After a brief pause, return to the starting position."],"lvl":"beginner"},{"id":"high-pull","n":"High Pull","eq":"bb","p":["traps"],"s":["reardelt","midback"],"pt":"pull","m":"comp","g":[]},{"id":"barbell-rack-pull","n":"Barbell Rack Pull","eq":"bb","p":["lowback"],"s":["traps","hams","glutes"],"pt":"hinge","m":"comp","g":[],"how":["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.","With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement.","Return the weight to the pins and repeat."],"lvl":"intermediate"},{"id":"deadlift","n":"Deadlift","eq":"bb","p":["hams"],"s":["glutes","lowback","traps","quads"],"pt":"hinge","m":"comp","g":["Conventional","Sumo"],"how":["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."],"lvl":"intermediate"},{"id":"trap-bar-deadlift","n":"Trap Bar Deadlift","eq":"other","p":["quads"],"s":["glutes","hams","lowback","traps"],"pt":"hinge","m":"comp","g":[],"how":["For this exercise load a trap bar, also known as a hex bar, to an appropriate weight resting on the ground. Stand in the center of the apparatus and grasp both handles.","Lower your hips, look forward with your head and keep your chest up.","Begin the movement by driving through the heels and extend your hips and knees. Avoid rounding your back at all times.","At the completion of the movement, lower the weight back to the ground under control."],"lvl":"beginner"},{"id":"t-bar-row","n":"T-Bar Row","eq":"other","p":["midback"],"s":["lats","biceps"],"pt":"pull","m":"comp","g":[],"how":["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.","Assume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.","Pull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."],"lvl":"beginner"},{"id":"chest-supported-row","n":"Chest-Supported Row","eq":"db","p":["midback"],"s":["lats","biceps","reardelt"],"pt":"pull","m":"comp","g":[],"how":["Position a bar in a rack to about waist height. You can also use a smith machine.","Take a wider than shoulder width grip on the bar and position yourself hanging underneath the bar. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.","Begin by flexing the elbow, pulling your chest towards the bar. Retract your shoulder blades as you perform the movement.","Pause at the top of the motion, and return yourself to the start position.","Repeat for the desired number of repetitions."],"lvl":"beginner"},{"id":"dead-hang","n":"Dead Hang","eq":"bw","p":["lats"],"s":["forearms"],"pt":"pull","m":"iso","g":[]},{"id":"scap-pull","n":"Scap Pull","eq":"bw","p":["midback"],"s":["lats"],"pt":"pull","m":"iso","g":[],"how":["Take a pronated grip on a pull-up bar.","From a hanging position, raise yourself a few inches without using your arms. Do this by depressing your shoulder girdle in a reverse shrugging motion.","Pause at the completion of the movement, and then slowly return to the starting position before performing more repetitions."],"lvl":"beginner"},{"id":"back-extension","n":"Back Extension","eq":"bw","p":["lowback"],"s":["glutes","hams"],"pt":"hinge","m":"iso","g":[],"how":["Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.","Adjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.","With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.","Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back.","Slowly raise your torso back to the initial position as you inhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-shoulder-press","n":"Dumbbell Shoulder Press","eq":"db","p":["frontdelt"],"s":["sidedelt","triceps"],"pt":"push","m":"comp","g":["Neutral","Pronated"],"how":["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.","Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.","Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.","Now, exhale and push the dumbbells upward until they touch at the top.","Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"machine-shoulder-press","n":"Machine Shoulder Press","eq":"mach","p":["frontdelt"],"s":["sidedelt","triceps"],"pt":"push","m":"comp","g":[],"how":["Sit down on the Shoulder Press Machine and select the weight.","Grab the handles to your sides as you keep the elbows bent and in line with your torso. This will be your starting position.","Now lift the handles as you exhale and you extend the arms fully. At the top of the position make sure that you hold the contraction for a second.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"seated-cable-shoulder-press","n":"Seated Cable Shoulder Press","eq":"cable","p":["frontdelt"],"s":["sidedelt","triceps"],"pt":"push","m":"comp","g":[],"how":["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 90 degrees to the body, with your head and chest up. The elbows should also be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together above your head.","After pausing at the top, return the handles to the starting position. Ensure that you maintain tension on the cables.","You can also execute this movement with your back off the pad and alternate hands."],"lvl":"beginner"},{"id":"arnold-press","n":"Arnold Press","eq":"db","p":["frontdelt"],"s":["sidedelt","triceps"],"pt":"push","m":"comp","g":[],"how":["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.","Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.","Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.","After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"overhead-press","n":"Overhead Press","eq":"bb","p":["frontdelt"],"s":["sidedelt","triceps"],"pt":"push","m":"comp","g":[],"how":["Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).","Once you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the shoulders slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"seated-barbell-shoulder-press","n":"Seated Barbell Shoulder Press","eq":"bb","p":["frontdelt"],"s":["sidedelt","triceps"],"pt":"push","m":"comp","g":[],"how":["Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).","Once you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the shoulders slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."],"lvl":"intermediate"},{"id":"smith-machine-shoulder-press","n":"Smith Machine Shoulder Press","eq":"smith","p":["frontdelt"],"s":["sidedelt","triceps"],"pt":"push","m":"comp","g":[],"how":["To begin, place a flat bench (or preferably one with back support) underneath a smith machine. Position the barbell at a height so that when seated on the flat bench, the arms must be almost fully extended to reach the barbell.","Once you have the correct height, sit slightly in behind the barbell so that there is an imaginary straight line from the tip of your nose to the barbell. Your feet should be stationary. Grab the barbell with the palms facing forward, unlock it and lift it up so that your arms are fully extended. This is the starting position.","Slowly begin to lower the barbell until it is level with your chin while inhaling.","Then lift the barbell back to the starting position using your shoulders while exhaling.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"dumbbell-lateral-raise","n":"Dumbbell Lateral Raise","eq":"db","p":["sidedelt"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"one-arm-cable-lateral-raise","n":"One-Arm Cable Lateral Raise","eq":"cable","p":["sidedelt"],"s":[],"pt":"push","m":"iso","g":[],"how":["Stand in the middle of two low pulleys that are opposite to each other and place a flat bench right behind you (in perpendicular fashion to you; the narrow edge of the bench should be the one behind you). Select the weight to be used on each pulley.","Now sit at the edge of the flat bench behind you with your feet placed in front of your knees.","Bend forward while keeping your back flat and rest your torso on the thighs.","Have someone give you the single handles attached to the pulleys. Grasp the left pulley with the right hand and the right pulley with the left after you select your weight. The pulleys should run under your knees and your arms will be extended with palms facing each other and a slight bend at the elbows. This will be the starting position.","While keeping the arms stationary, raise the upper arms to the sides until they are parallel to the floor and at shoulder height. Exhale during the execution of this movement and hold the contraction for a second.","Slowly lower your arms to the starting position as you inhale."],"lvl":"beginner"},{"id":"machine-lateral-raise","n":"Machine Lateral Raise","eq":"mach","p":["sidedelt"],"s":[],"pt":"push","m":"iso","g":[],"how":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"super-range-lateral-raise","n":"Super-Range Lateral Raise","eq":"db","p":["sidedelt"],"s":[],"pt":"push","m":"iso","g":[],"how":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"lvl":"beginner"},{"id":"side-and-front-raise-burnout","n":"Side and Front Raise Burnout","eq":"db","p":["sidedelt"],"s":["frontdelt"],"pt":"push","m":"iso","g":[],"how":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand
